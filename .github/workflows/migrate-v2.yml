name: Migrate Casa7014 to V2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casa7014-v2
  cancel-in-progress: false

jobs:

  migrate-v2:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================================
      # INSTALL YQ
      # ==========================================================

      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail

          wget -qO /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          echo "${YQ_SHA256}  /tmp/yq" \
            | sha256sum -c -

          sudo install \
            -m 0755 \
            /tmp/yq \
            /usr/local/bin/yq

          yq --version

      # ==========================================================
      # TEST SCRIPTS
      # ==========================================================

      - name: Test V2 scripts
        run: |
          bash .github/scripts/test-v2-scripts.sh

      # ==========================================================
      # MIGRATE V1 -> V2
      # ==========================================================

      - name: Migrate Apps to V2
        run: |
          bash .github/scripts/migrate-to-v2.sh

      # ==========================================================
      # LINT V2
      # ==========================================================

      - name: Lint V2 invariants
        run: |
          bash .github/scripts/lint-casaos-v2.sh

      # ==========================================================
      # DETECT MIGRATION
      # ==========================================================

      - name: Detect V2 migration
        id: migrated
        run: |
          bash .github/scripts/detect-v2-migration.sh

      # ==========================================================
      # BUILD V2
      # ==========================================================

      - name: Build V2
        if: steps.migrated.outputs.migrated == 'true'
        id: build_v2
        uses: IceWhaleTech/build-appstore-action@787271faebb0ef2101eb0f85d5485ff7208140db
        with:
          source: .
          output: dist
          base-url: https://yassinletaief.tn/casa7014
          report-json: out/build-v2-report.json
          report-title: Casa7014 V2 Build Report

        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================================
      # UPLOAD BUILD REPORT
      # ==========================================================

      - name: Upload V2 build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: casa7014-v2-report
          path: out/build-v2-report.json
          if-no-files-found: ignore

      # ==========================================================
      # FAIL IF BUILD FAILED
      # ==========================================================

      - name: Fail if V2 build failed
        if: always() && steps.build_v2.outcome != 'success'
        run: |
          echo "Casa7014 V2 build failed."
          echo "Check the build-v2-report artifact."
          exit 1

      # ==========================================================
      # VERIFY OUTPUT
      # ==========================================================

      - name: Verify V2 output
        if: steps.migrated.outputs.migrated == 'true'
        run: |
          set -euo pipefail

          test -f dist/store.json
          test -f dist/index.json

          echo "V2 output verified successfully."

          echo
          echo "Generated files:"
          find dist -maxdepth 5 -type f | sort

      # ==========================================================
      # UPLOAD DIST
      # ==========================================================

      - name: Upload V2 store
        if: steps.migrated.outputs.migrated == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: casa7014-v2-store
          path: dist
          if-no-files-found: error

      # ==========================================================
      # COMMIT MIGRATION
      # ==========================================================

      - name: Commit automatic V2 migration
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Apps \
            store-config.json \
            supported-languages.json

          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi

          git commit \
            -m "chore: migrate app store to CasaOS V2 [skip ci]"

          git push origin HEAD:main
