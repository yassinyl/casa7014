name: linkstack
services:
  linkstack:
    hostname: linkstack
    image: sc4ndium90/linkstack:v4.8.6@sha256:89f7bfe284f2183a30950b9b6102c6922abe799e180d961422c4bab05bd3cb5c
    environment:
      TZ: $TZ
      SERVER_ADMIN: admin@example.com
      HTTP_SERVER_NAME: example.com
      HTTPS_SERVER_NAME: example.com
      LOG_LEVEL: info
      PHP_MEMORY_LIMIT: 256M
      UPLOAD_MAX_FILESIZE: 8M
    ports:
      - target: 80
        published: "8081"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/htdocs
        target: /htdocs
    restart: unless-stopped
    container_name: linkstack
    network_mode: bridge
x-casaos:
  id: com.casa7014.linkstack
  main: linkstack
  port_map: "8081"
  index: /
  scheme: http
  title:
    en_US: LinkStack
    ar_SA: LinkStack
    de_DE: LinkStack
    es_ES: LinkStack
    fr_FR: LinkStack
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@gh-pages/apps/com.casa7014.linkstack/assets/icon.png
  version: "4.8.6"
