name: aria2
services:
  aria2:
    image: johngong/aria2:1.36.0
    container_name: aria2
    restart: unless-stopped
    network_mode: bridge
    ports:
      - target: 6881
        published: "6881"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: udp
      - target: 6800
        published: "6800"
        protocol: tcp
      - target: 8080
        published: "6880"
        protocol: tcp
    environment:
      ARIA2_RPC_SECRET: token
      ARIA2_RPC_LISTEN_PORT: "6800"
      ARIA2_LISTEN_PORT: "6881"
      ARIA2_TRACKERS_UPDATE_AUTO: "true"
      ARIA2_TRACKERS_LIST_URL: https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt
      UID: "1000"
      GID: "1000"
      UMASK: "022"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /Downloads
x-casaos:
  id: com.casa7014.aria2
  main: aria2
  architectures: [amd64, arm, arm64]
  port_map: "6880"
  index: /#!/downloading
  scheme: http
  title:
    en_US: Aria2
    ar_SA: Aria2
    de_DE: Aria2
    es_ES: Aria2
    fr_FR: Aria2
  author: yassinyl
  developer: johngong
  category: Others
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Aria2/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Aria2/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Aria2/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Aria2/screenshot-2.png
  description:
    en_US: Lightweight multi-protocol and multi-source download utility.
    ar_SA: أداة تنزيل خفيفة تدعم عدة بروتوكولات ومصادر.
    de_DE: Leichtgewichtiger Download-Client für mehrere Protokolle und Quellen.
    es_ES: Utilidad ligera de descargas multiprotocolo y multifuente.
    fr_FR: Utilitaire de téléchargement léger, multiprotocole et multisource.
  tagline:
    en_US: Lightweight multi-protocol download utility
    ar_SA: أداة تنزيل خفيفة متعددة البروتوكولات.
    de_DE: Leichtgewichtiger Download-Client für mehrere Protokolle.
    es_ES: Utilidad ligera de descargas multiprotocolo.
    fr_FR: Utilitaire de téléchargement léger et multiprotocole.
  version: "1.36.0"
  repo: https://github.com/johngong/aria2
  docs: https://aria2.github.io/
