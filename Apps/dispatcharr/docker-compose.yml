name: dispatcharr
services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.30.0
    container_name: dispatcharr
    restart: unless-stopped
    ports:
      - target: 9191
        published: "9191"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    environment:
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
    x-casaos:
      ports:
        - container: "9191"
          description:
            en_US: Dispatcharr WebUI port
      volumes:
        - container: /data
          description:
            en_US: Dispatcharr data directory
x-casaos:
  id: com.casa7014.dispatcharr
  main: dispatcharr
  architectures: [amd64, arm64]
  port_map: "9191"
  index: /
  scheme: http
  title:
    en_US: Dispatcharr
  author: yassinyl
  developer: Dispatcharr
  category: Media
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/dispatcharr/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/dispatcharr/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/dispatcharr/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/dispatcharr/screenshot-2.png
  description:
    en_US: IPTV stream management platform for channels, streams, EPG and DVR.
  tagline:
    en_US: IPTV Stream Management and DVR
  version: "0.30.0"
  repo: https://github.com/Dispatcharr/Dispatcharr
