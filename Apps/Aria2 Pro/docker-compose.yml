name: aria2-pro
services:
  ariang:
    container_name: aria2-ariang
    image: p3terx/ariang:latest
    restart: unless-stopped
    ports:
      - target: 6880
        published: "6880"
        protocol: tcp
  aria2-pro:
    image: p3terx/aria2-pro:202209060423
    container_name: aria2-pro
    restart: unless-stopped
    network_mode: bridge
    environment:
      LISTEN_PORT: "6888"
      PGID: $PGID
      PUID: $PUID
      RPC_PORT: "6800"
      RPC_SECRET: TOKEN
    ports:
      - target: 6800
        published: "6800"
        protocol: tcp
      - target: 6888
        published: "6888"
        protocol: tcp
      - target: 6888
        published: "6888"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/Downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
x-casaos:
  id: com.casa7014.aria2-pro
  # AriaNg is the browser interface; aria2-pro only exposes its RPC service.
  main: ariang
  architectures: [amd64, arm64, arm, "386"]
  port_map: "6880"
  index: /
  scheme: http
  title:
    en_US: Aria2 Pro
    ar_SA: Aria2 Pro
    de_DE: Aria2 Pro
    es_ES: Aria2 Pro
