name: portracker

services:
  portracker:
    image: mostafawahied/portracker:1.3.13
    container_name: portracker
    restart: unless-stopped
    pid: host

    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    ports:
      - target: 4999
        published: "4999"
        protocol: tcp

    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:4999/api/health
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    x-casaos:
      ports:
        - container: "4999"
          description:
            en_US: Portracker Web UI port
      volumes:
        - container: /data
          description:
            en_US: Portracker database and application data

x-casaos:
  id: com.casa7014.portracker
  main: portracker
  architectures:
    - amd64
    - arm64
  port_map: "4999"
  index: /
  scheme: http

  title:
    en_US: Portracker

  author: yassinyl
  developer: Mostafa Wahied
  category: Networking

  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/portracker/icon.png

  screenshot_link:
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/portracker/screenshot-1.png

  description:
    en_US: Portracker is a self-hosted, real-time port monitoring and discovery tool that automatically discovers services, ports, Docker containers, and network services on your systems.

  tagline:
    en_US: Real-time port monitoring and discovery

  version: "1.3.13"

  update_at: "2026-09-17"

  release_notes:
    en_US: |-
      Portracker 1.3.13 provides real-time port monitoring and discovery,
      Docker container discovery, internal and published port detection,
      peer monitoring, and a modern web dashboard.

  website: https://github.com/mostafa-wahied/portracker
  repo: https://github.com/mostafa-wahied/portracker
  support: https://github.com/mostafa-wahied/portracker/issues
  docs: https://github.com/mostafa-wahied/portracker#readme
