name: Docker Image Update Bot

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Scan Docker images and create update PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          for compose in Apps/*/docker-compose.yml; do
            [ -f "$compose" ] || continue

            app_dir="$(dirname "$compose")"
            app_name="$(basename "$app_dir")"

            echo
            echo "========================================"
            echo "Checking: $app_name"
            echo "========================================"

            image="$(grep -E '^[[:space:]]*image:[[:space:]]*' "$compose" \
              | head -n1 \
              | sed -E 's/^[[:space:]]*image:[[:space:]]*//' \
              | tr -d '"' \
              | tr -d "'")"

            if [ -z "$image" ]; then
              echo "No image found - skip"
              continue
            fi

            echo "Image: $image"

            # Digest-pinned images are intentionally skipped.
            if [[ "$image" == *@sha256:* ]]; then
              echo "Digest image - skip"
              continue
            fi

            # Extract repository and tag.
            if [[ "$image" != *:* ]]; then
              echo "No explicit tag - skip"
              continue
            fi

            current_tag="${image##*:}"
            repository="${image%:*}"

            # Explicit requirement: never update latest.
            if [[ "$current_tag" == "latest" ]]; then
              echo "latest tag - skip"
              continue
            fi

            # GHCR is handled separately so Docker Hub API is never used
            # against a GHCR image.
            if [[ "$repository" == ghcr.io/* ]]; then
              echo "GHCR image - skip in this Docker Hub bot"
              continue
            fi

            # Docker Hub short names.
            if [[ "$repository" != */* ]]; then
              repository="library/$repository"
            fi

            echo "Current version: $current_tag"

            api_url="https://hub.docker.com/v2/repositories/${repository}/tags/?page_size=100"

            json="$(curl -fsSL "$api_url" 2>/dev/null || true)"

            if [ -z "$json" ]; then
              echo "Docker Hub lookup failed - skip"
              continue
            fi

            # Find the newest normal semantic-version tag.
            newest="$(
              printf '%s' "$json" |
              jq -r '.results[].name' |
              grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n1
            )"

            if [ -z "$newest" ]; then
              echo "No semantic version found - skip"
              continue
            fi

            current_normalized="${current_tag#v}"
            newest_normalized="${newest#v}"

            if [ "$current_normalized" = "$newest_normalized" ]; then
              echo "Already up to date"
              continue
            fi

            lowest="$(
              printf '%s\n%s\n' \
                "$current_normalized" \
                "$newest_normalized" |
              sort -V |
              head -n1
            )"

            if [ "$lowest" != "$current_normalized" ]; then
              echo "Update available: $current_tag -> $newest"

              slug="$(printf '%s' "$app_name" |
                tr '[:upper:]' '[:lower:]' |
                sed 's/[^a-z0-9._-]/-/g' |
                sed 's/--*/-/g' |
                sed 's/^-//;s/-$//')"

              branch="bot/docker-update/${slug}-${newest}"

              # Do not create another PR if one already exists.
              existing_pr="$(
                gh pr list \
                  --repo "$GH_REPO" \
                  --head "$branch" \
                  --state open \
                  --json number \
                  --jq '.[0].number // empty'
              )"

              if [ -n "$existing_pr" ]; then
                echo "PR #$existing_pr already exists - skip"
                continue
              fi

              # Create a clean isolated branch from main.
              git fetch origin main
              git checkout -B "$branch" "origin/main"

              python3 - "$compose" "$newest" <<'PY'
import re
import sys
from pathlib import Path

compose = Path(sys.argv[1])
new_tag = sys.argv[2]

text = compose.read_text(encoding="utf-8")

# Update the first image line only.
pattern = r'(^[ \t]*image:[ \t]*)([^\s]+)([ \t]*$)'
match = re.search(pattern, text, flags=re.MULTILINE)

if not match:
    raise SystemExit("Could not find image line")

old_image = match.group(2)
base = old_image.rsplit(":", 1)[0]
new_image = f"{base}:{new_tag}"

text = (
    text[:match.start()]
    + match.group(1)
    + new_image
    + match.group(3)
    + text[match.end():]
)

# Synchronize x-casaos.version with the image tag.
lines = text.splitlines()
inside = False
base_indent = None
updated = False

for i, line in enumerate(lines):
    stripped = line.lstrip()
    indent = len(line) - len(stripped)

    if stripped == "x-casaos:":
        inside = True
        base_indent = indent
        continue

    if inside and stripped and indent <= base_indent:
        inside = False

    if inside and re.match(r'^\s+version:\s*', line):
        lines[i] = re.sub(
            r'(^\s+version:\s*).*$',
            lambda m: m.group(1) + new_tag,
            line
        )
        updated = True
        break

if updated:
    text = "\n".join(lines) + "\n"

compose.write_text(text, encoding="utf-8")
PY

              git config user.name "casa7014 Docker Update Bot"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git add "$compose"

              if git diff --cached --quiet; then
                echo "No changes after update - skip"
                git checkout main
                continue
              fi

              git commit -m "chore($app_name): update Docker image to $newest"

              git push --force-with-lease \
                origin \
                "HEAD:refs/heads/$branch"

              pr_body="$(cat <<EOF
## 🐳 Docker Image Update

**Application:** \`$app_name\`

| | Version |
|---|---|
| Current | \`$current_tag\` |
| New | \`$newest\` |
| Image | \`$image\` |

### Changes
- Updated Docker image tag from \`$current_tag\` to \`$newest\`
- Updated \`x-casaos.version\` to \`$newest\`

### Validation
The existing casa7014 V2 validation/migration workflows remain responsible for:
- Docker image validation
- Architecture validation
- CasaOS V2 structure validation
- x-casaos validation
- Icon/assets validation
- Store build validation

This bot intentionally does **not** duplicate those checks.

---
🤖 Automated by **casa7014 Docker Update Bot**
EOF
)"

              gh pr create \
                --repo "$GH_REPO" \
                --head "$branch" \
                --base main \
                --title "🐳 Update $app_name to $newest" \
                --body "$pr_body" \
                --label "docker-update" \
                || \
              gh pr create \
                --repo "$GH_REPO" \
                --head "$branch" \
                --base main \
                --title "🐳 Update $app_name to $newest" \
                --body "$pr_body"

              git checkout main
            else
              echo "No newer version"
            fi
          done
