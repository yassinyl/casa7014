name: lan-orangutan
services:
  lan-orangutan:
    image: ghcr.io/291-group/lan-orangutan:3.3.8
    container_name: lan-orangutan
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      ORANGUTAN_PORT: "291"
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /var/lib/lan-orangutan
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:291/static/orangutan.svg
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/lan-orangutan/icon.png
x-casaos:
  id: com.casa7014.lan-orangutan
  main: lan-orangutan
  architectures:
    - amd64
    - arm64
  port_map: "291"
  index: /
  scheme: http
  title:
    en_US: LAN Orangutan
    ar_SA: LAN Orangutan
    de_DE: LAN Orangutan
    es_ES: LAN Orangutan
    fr_FR: LAN Orangutan
  author: yassinyl
  developer: 291 Group
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/lan-orangutan/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/lan-orangutan/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/lan-orangutan/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/lan-orangutan/screenshot-2.png
  description:
    en_US: LAN Orangutan is a self-hosted network discovery and device inventory tool that scans your LAN, identifies devices, and helps you organize and monitor your network.
    ar_SA: LAN Orangutan أداة مستضافة ذاتيًا لاكتشاف الشبكة وجرد الأجهزة، تفحص الشبكة المحلية وتتعرف على الأجهزة وتساعدك على تنظيم الشبكة ومراقبتها.
    de_DE: LAN Orangutan ist ein selbst gehostetes Tool zur Netzwerkerkennung und Geräteinventarisierung, das Ihr LAN scannt, Geräte identifiziert und bei Organisation und Überwachung hilft.
    es_ES: LAN Orangutan es una herramienta autoalojada de descubrimiento de red e inventario de dispositivos que analiza la LAN, identifica dispositivos y ayuda a organizar y supervisar la red.
    fr_FR: LAN Orangutan est un outil auto-hébergé de découverte réseau et d’inventaire des appareils, qui analyse le réseau local, identifie les appareils et aide à organiser et surveiller le réseau.
  tagline:
