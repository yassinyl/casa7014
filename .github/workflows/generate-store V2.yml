name: Migrate Casa7014 to V2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casa7014-v2
  cancel-in-progress: false

jobs:
  migrate-v2:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-yaml \
            jq

      # ==========================================================
      # MIGRATE APPS
      # ==========================================================

      - name: Migrate Apps to V2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import yaml

          APPS_DIR = "Apps"

          CATEGORY_MAP = {
              "Casa7014": "Others",
              "Other": "Others",
              "Others": "Others",

              "Utility": "Productivity",
              "Utilities": "Productivity",
              "Tools": "Productivity",
              "Tool": "Productivity",

              "Network": "Networking",
              "Networking": "Networking",

              "Development": "Developer",
              "Developer": "Developer",

              "Media": "Media",
              "Productivity": "Productivity",
              "Home": "Home",
              "AI": "AI",
              "Finance": "Finance",
              "Social": "Social",
          }

          ALLOWED_CATEGORIES = {
              "Media",
              "Productivity",
              "Home",
              "Networking",
              "AI",
              "Finance",
              "Social",
              "Developer",
              "Others",
          }

          def normalize_locales(value):

              if isinstance(value, dict):

                  result = {}

                  for key, val in value.items():

                      if key.lower() == "en_us":
                          key = "en_US"

                      elif key.lower() == "zh_cn":
                          key = "zh_CN"

                      result[key] = normalize_locales(val)

                  return result

              if isinstance(value, list):

                  return [
                      normalize_locales(v)
                      for v in value
                  ]

              return value

          def make_id(app_name):

              slug = re.sub(
                  r"[^a-zA-Z0-9]+",
                  "-",
                  app_name
              ).strip("-").lower()

              return f"com.casa7014.{slug}"

          def get_port_from_compose(data):

              services = data.get(
                  "services",
                  {}
              )

              for service in services.values():

                  ports = service.get(
                      "ports",
                      []
                  )

                  for port in ports:

                      if isinstance(port, int):
                          return str(port)

                      if not isinstance(port, str):
                          continue

                      value = port.strip()

                      if "/udp" in value.lower():
                          continue

                      value = value.replace(
                          "/tcp",
                          ""
                      )

                      parts = value.split(":")

                      if len(parts) >= 2:

                          published = parts[-2]

                          if published.isdigit():
                              return published

                      elif len(parts) == 1:

                          if parts[0].isdigit():
                              return parts[0]

              return None

          def get_port_from_environment(data):

              services = data.get(
                  "services",
                  {}
              )

              preferred = [
                  "HTTP_PORT",
                  "WEB_PORT",
                  "SERVER_PORT",
                  "PORT",
                  "METRICS_PORT",
                  "CSS_METRICS_PORT",
              ]

              candidates = []

              for service in services.values():

                  env = service.get(
                      "environment",
                      []
                  )

                  if isinstance(env, dict):

                      items = env.items()

                  else:

                      items = []

                      for item in env:

                          if not isinstance(
                              item,
                              str
                          ):
                              continue

                          if "=" not in item:
                              continue

                          key, value = item.split(
                              "=",
                              1
                          )

                          items.append(
                              (key, value)
                          )

                  for key, value in items:

                      if not isinstance(
                          value,
                          str
                      ):
                          continue

                      value = value.strip()

                      if not value.isdigit():
                          continue

                      if key.upper().endswith(
                          "_PORT"
                      ):

                          candidates.append(
                              (
                                  key.upper(),
                                  value
                              )
                          )

              for wanted in preferred:

                  for key, value in candidates:

                      if key == wanted:
                          return value

              if candidates:
                  return candidates[0][1]

              return None

          def get_existing_port(xc):

              value = xc.get(
                  "port_map"
              )

              if value is None:
                  return None

              value = str(
                  value
              ).strip()

              if value.isdigit():
                  return value

              return None

          errors = []

          for app_name in sorted(
              os.listdir(APPS_DIR)
          ):

              app_dir = os.path.join(
                  APPS_DIR,
                  app_name
              )

              if not os.path.isdir(
                  app_dir
              ):
                  continue

              compose_path = os.path.join(
                  app_dir,
                  "docker-compose.yml"
              )

              if not os.path.isfile(
                  compose_path
              ):
                  continue

              print()
              print("=" * 70)
              print(f"Migrating: {app_name}")
              print("=" * 70)

              try:

                  with open(
                      compose_path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = yaml.safe_load(f)

              except Exception as e:

                  errors.append(
                      f"{app_name}: YAML error: {e}"
                  )

                  continue

              if not isinstance(
                  data,
                  dict
              ):

                  errors.append(
                      f"{app_name}: invalid YAML"
                  )

                  continue

              services = data.get(
                  "services",
                  {}
              )

              if not services:

                  errors.append(
                      f"{app_name}: no services"
                  )

                  continue

              # ==================================================
              # TOP LEVEL NAME
              # ==================================================

              if not data.get("name"):

                  data["name"] = re.sub(
                      r"[^a-zA-Z0-9_-]+",
                      "-",
                      app_name
                  ).strip("-").lower()

              # ==================================================
              # X-CASAOS
              # ==================================================

              xc = data.setdefault(
                  "x-casaos",
                  {}
              )

              # ==================================================
              # ID
              # ==================================================

              current_id = xc.get("id")

              if (
                  not isinstance(
                      current_id,
                      str
                  )
                  or not current_id
              ):

                  xc["id"] = make_id(
                      app_name
                  )

              # IMPORTANT:
              # id is directly under x-casaos
              assert "id" in xc

              # ==================================================
              # MAIN
              # ==================================================

              if not xc.get("main"):

                  if len(services) == 1:

                      xc["main"] = next(
                          iter(services)
                      )

              if not xc.get("main"):

                  errors.append(
                      f"{app_name}: "
                      "cannot determine main"
                  )

                  continue

              # ==================================================
              # INDEX
              # ==================================================

              if not xc.get("index"):

                  xc["index"] = "/"

              # ==================================================
              # PORT
              # ==================================================

              port = get_existing_port(
                  xc
              )

              if port is None:

                  port = get_port_from_compose(
                      data
                  )

              if port is None:

                  port = get_port_from_environment(
                      data
                  )

              # CastSponsorSkip
              if (
                  port is None
                  and app_name.lower()
                  == "castsponsorskip"
              ):

                  port = "9790"

              if port is None:

                  errors.append(
                      f"{app_name}: "
                      "cannot determine port_map"
                  )

                  continue

              xc["port_map"] = str(
                  port
              )

              # ==================================================
              # SCHEME
              # ==================================================

              if not xc.get("scheme"):

                  xc["scheme"] = "http"

              # ==================================================
              # ICON
              # ==================================================

              if not xc.get("icon"):

                  icons = [
                      "icon.svg",
                      "icon.png",
                      "icon.jpg",
                      "icon.jpeg",
                  ]

                  found = None

                  for icon in icons:

                      path = os.path.join(
                          app_dir,
                          icon
                      )

                      if os.path.isfile(
                          path
                      ):

                          found = icon
                          break

                  if found:

                      xc["icon"] = (
                          "https://cdn.jsdelivr.net/gh/"
                          "yassinyl/casa7014@main/"
                          f"Apps/{app_name}/{found}"
                      )

                  else:

                      errors.append(
                          f"{app_name}: "
                          "missing icon"
                      )

                      continue

              # ==================================================
              # NORMALIZE LOCALES
              # ==================================================

              xc = normalize_locales(
                  xc
              )

              # ==================================================
              # TITLE
              # ==================================================

              if not xc.get("title"):

                  xc["title"] = {
                      "en_US": app_name
                  }

              # ==================================================
              # TAGLINE
              # ==================================================

              if not xc.get("tagline"):

                  xc["tagline"] = {
                      "en_US": app_name
                  }

              # ==================================================
              # DESCRIPTION
              # ==================================================

              if not xc.get("description"):

                  xc["description"] = {
                      "en_US": app_name
                  }

              # ==================================================
              # CATEGORY
              # ==================================================

              category = xc.get(
                  "category"
              )

              if category not in ALLOWED_CATEGORIES:

                  xc["category"] = CATEGORY_MAP.get(
                      category,
                      "Others"
                  )

              # ==================================================
              # ARCHITECTURES
              # ==================================================

              if not xc.get(
                  "architectures"
              ):

                  xc["architectures"] = [
                      "amd64",
                      "arm64"
                  ]

              # ==================================================
              # VERSION
              # ==================================================

              if not xc.get("version"):

                  xc["version"] = "1.0.0"

              # ==================================================
              # SAVE
              # ==================================================

              data["x-casaos"] = xc

              with open(
                  compose_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  yaml.safe_dump(
                      data,
                      f,
                      sort_keys=False,
                      allow_unicode=True
                  )

              print(
                  f"ID:       {xc['id']}"
              )
              print(
                  f"MAIN:     {xc['main']}"
              )
              print(
                  f"PORT:     {xc['port_map']}"
              )
              print(
                  f"CATEGORY: {xc['category']}"
              )
              print(
                  f"VERSION:  {xc['version']}"
              )

              print(
                  "Migration: OK"
              )

          if errors:

              print()
              print("=" * 70)
              print("MIGRATION ERRORS")
              print("=" * 70)

              for error in errors:

                  print(
                      f"ERROR: {error}"
                  )

              raise SystemExit(1)

          print()
          print("=" * 70)
          print("ALL APPS MIGRATED SUCCESSFULLY")
          print("=" * 70)
          PY

      # ==========================================================
      # SUPPORTED LANGUAGES
      # ==========================================================

      - name: Create supported-languages.json
        run: |
          cat > supported-languages.json <<'EOF'
          [
            "en_US"
          ]
          EOF

      # ==========================================================
      # STORE CONFIG
      # ==========================================================

      - name: Normalize store-config.json
        run: |
          set -e

          if [ ! -f store-config.json ]; then

            cat > store-config.json <<'EOF'
          {
            "version": 2,
            "store_id": "casa7014-yl",
            "name": {
              "en_US": "Casa7014 Apps"
            },
            "description": {
              "en_US": "Casa7014 Apps"
            },
            "maintainer": "yassinyl",
            "url": "https://github.com/yassinyl/casa7014"
          }
          EOF

          else

            jq '
              .version = 2 |
              .store_id = (.store_id // "casa7014-yl") |
              .name = (.name // {"en_US":"Casa7014 Apps"}) |
              .description = (.description // {"en_US":"Casa7014 Apps"}) |
              .maintainer = (.maintainer // "yassinyl") |
              .url = (.url // "https://github.com/yassinyl/casa7014")
            ' store-config.json \
              > store-config.tmp

            mv \
              store-config.tmp \
              store-config.json

          fi

      # ==========================================================
      # VALIDATE SOURCE
      # ==========================================================

      - name: Validate V2 structure
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import yaml

          required = [
              "id",
              "main",
              "index",
              "port_map",
              "icon",
              "title",
              "category",
              "version",
          ]

          errors = []

          for app_name in sorted(
              os.listdir("Apps")
          ):

              compose = os.path.join(
                  "Apps",
                  app_name,
                  "docker-compose.yml"
              )

              if not os.path.isfile(
                  compose
              ):
                  continue

              with open(
                  compose,
                  encoding="utf-8"
              ) as f:

                  data = yaml.safe_load(f)

              xc = data.get(
                  "x-casaos"
              )

              if not isinstance(
                  xc,
                  dict
              ):

                  errors.append(
                      f"{app_name}: "
                      "missing x-casaos"
                  )

                  continue

              # ID MUST be directly under x-casaos
              if "id" not in xc:

                  errors.append(
                      f"{app_name}: "
                      "x-casaos.id missing"
                  )

              # Make sure it is not accidentally under service
              for service_name, service in data.get(
                  "services",
                  {}
              ).items():

                  if isinstance(
                      service,
                      dict
                  ) and "id" in service:

                      errors.append(
                          f"{app_name}: "
                          f"id found under service "
                          f"{service_name}"
                      )

              missing = [
                  key
                  for key in required
                  if not xc.get(key)
              ]

              if missing:

                  errors.append(
                      f"{app_name}: "
                      + ", ".join(missing)
                  )

              else:

                  print(
                      f"OK: {app_name}"
                  )

                  print(
                      f"    id = {xc['id']}"
                  )

                  print(
                      f"    port = {xc['port_map']}"
                  )

          if errors:

              print()
              print("VALIDATION ERRORS:")

              for error in errors:

                  print(
                      f" - {error}"
                  )

              raise SystemExit(1)

          print()
          print(
              "ALL APPS PASSED V2 VALIDATION"
          )
          PY

      # ==========================================================
      # SHOW EXAMPLE
      # ==========================================================

      - name: Show migrated YAML
        run: |
          echo "Example migrated App:"
          echo

          FIRST_APP=$(find Apps \
            -mindepth 2 \
            -maxdepth 2 \
            -name docker-compose.yml \
            | sort \
            | head -n 1)

          if [ -n "$FIRST_APP" ]; then
            cat "$FIRST_APP"
          fi

      # ==========================================================
      # COMMIT MIGRATION
      # ==========================================================

      - name: Commit V2 migration
        shell: bash
        run: |
          set -e

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Apps \
            store-config.json \
            supported-languages.json

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "chore: migrate app store to CasaOS V2 [skip ci]"

            git push \
              origin \
              HEAD:refs/heads/main

          fi

      # ==========================================================
      # BUILD V2
      # ==========================================================

      - name: Build CasaOS V2
        id: build_v2
        uses: IceWhaleTech/build-appstore-action@main
        with:
          source: .
          output: dist
          base-url: https://yassinletaief.tn/casa7014
          report-json: out/build-v2-report.json
          report-title: Casa7014 V2 Build Report

      # ==========================================================
      # BUILD RESULT
      # ==========================================================

      - name: Show V2 output
        run: |
          echo "======================================"
          echo "CasaOS V2 BUILD OUTPUT"
          echo "======================================"

          find dist \
            -maxdepth 4 \
            -type f \
            | sort

      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload V2 Store
        uses: actions/upload-artifact@v6
        with:
          name: casa7014-v2-store
          path: dist

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: casa7014-v2-report
          path: out/build-v2-report.json
          if-no-files-found: ignore
