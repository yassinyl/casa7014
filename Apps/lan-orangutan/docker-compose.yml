    de_DE: Netzwerkerkennung und Geräteinventar.
    es_ES: Descubrimiento de red e inventario de dispositivos.
    fr_FR: Découverte réseau et inventaire des appareils.
  version: "3.3.8"
  update_at: "2026-09-16"
  release_notes:
    en_US: |-
      LAN Orangutan 3.3.8 improves LAN device discovery, device identification,
