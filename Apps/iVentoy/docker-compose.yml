name: iventoy

services:
  iventoy:
    image: ziggyds/iventoy:latest
    container_name: iventoy
    restart: always
    privileged: true

    ports:
      - "26000:26000"

    environment:
      AUTO_START_PXE: "true"

    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/iso
        target: /app/iso

      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data

      - type: bind
        source: /DATA/AppData/$AppID/log
        target: /app/log

    networks:
      iventoy_macvlan:
        ipv4_address: 192.168.1.170


networks:
  iventoy_macvlan:
    driver: macvlan

    driver_opts:
      parent: eth0

    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
          ip_range: 192.168.1.160/28


x-casaos:
  id: com.casa7014.iventoy
  main: iventoy

  architectures:
    - amd64

  port_map: "26000"
  index: /
  scheme: http

  title:
    en_US: iVentoy
    ar_SA: iVentoy
    de_DE: iVentoy
    es_ES: iVentoy
    fr_FR: iVentoy

  author: yassinyl
  developer: iVentoy
  category: Networking

  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/iVentoy/icon.png

  screenshot_link:
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/iVentoy/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/iVentoy/screenshot-2.png

  description:
    en_US: iVentoy is a PXE network boot server that allows computers to boot and install operating systems over the network using ISO images.
    ar_SA: iVentoy هو خادم إقلاع شبكي PXE يسمح للحواسيب بالإقلاع وتثبيت أنظمة التشغيل عبر الشبكة باستعمال ملفات ISO.
    de_DE: iVentoy ist ein PXE-Netzwerk-Bootserver, mit dem Computer Betriebssysteme über das Netzwerk mithilfe von ISO-Images starten können.
    es_ES: iVentoy es un servidor de arranque PXE que permite iniciar e instalar sistemas operativos mediante la red utilizando imágenes ISO.
    fr_FR: iVentoy est un serveur de démarrage réseau PXE permettant de démarrer et d’installer des systèmes d’exploitation via le réseau à l’aide d’images ISO.

  tagline:
    en_US: PXE Network Boot Server
    ar_SA: خادم إقلاع شبكي PXE
    de_DE: PXE-Netzwerk-Bootserver
    es_ES: Servidor de arranque PXE
    fr_FR: Serveur de démarrage PXE

  version: "1.0.44"

  website: https://www.iventoy.com
  repo: https://github.com/ventoy/PXE
  support: https://www.iventoy.com/en/contact.html
  docs: https://www.iventoy.com/en/doc_start.html

  tips:
    before_install:
      en_US: |
        IMPORTANT - NETWORK CONFIGURATION

        iVentoy uses a macvlan network and requires a dedicated
        IP address on your local network.

        The macvlan network is created automatically during
        installation.

        IMPORTANT:

        Before installing iVentoy, check the network settings
        in the Docker Compose configuration.

        The following values must match your local network:

        - parent: your physical LAN interface
        - subnet: your local IPv4 subnet
        - gateway: your router IP
        - ipv4_address: an unused IP address on your LAN
        - ip_range: an unused IP range on your LAN

        Example:

        parent: eth0

        subnet: 192.168.1.0/24

        gateway: 192.168.1.1

        ipv4_address: 192.168.1.170

        ip_range: 192.168.1.160/28

        Make sure that the selected iVentoy IP address is not
        already used by another device.

        IMPORTANT:

        Port 26000 is published for the Web interface.

        The remaining iVentoy PXE services use the macvlan
        network directly.

        If your network configuration is different from the
        example above, change the macvlan network settings
        before installation.

    after_install:
      en_US: |
        IMPORTANT - COMPLETE iVentoy SETUP

        After the installation is complete:

        1. Download the latest Linux Free Edition from:

        https://github.com/ventoy/PXE/releases

        2. Extract the downloaded archive.

        3. Open the extracted "data" directory.

        4. Copy these two files:

        iventoy.dat
        mac.db

        5. Copy both files to:

        /DATA/AppData/iVentoy/data/

        The final structure must be:

        /DATA/AppData/iVentoy/data/iventoy.dat
        /DATA/AppData/iVentoy/data/mac.db

        6. Restart the iVentoy container.

        After restarting, open the Web interface using:

        http://<iVentoy-IP>:26000

        If your router already provides DHCP, use iVentoy
        ProxyNet mode.

        Do NOT enable iVentoy Internal DHCP.
