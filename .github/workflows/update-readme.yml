name: Update README App List

on:
  push:
    branches:
      - main
    paths:
      - "Apps/**"
      - "README.md"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:

  update-readme:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      # ==========================================================
      # INSTALL PYYAML
      # ==========================================================

      - name: Install PyYAML
        run: |
          python3 -m pip install --quiet PyYAML

      # ==========================================================
      # GENERATE APPLICATION TABLE
      # ==========================================================

      - name: Generate application table
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import urllib.parse
          import yaml

          ROOT = "Apps"
          README = "README.md"

          START = "<!-- apps:start -->"
          END = "<!-- apps:end -->"

          apps = []


          # ======================================================
          # HELPERS
          # ======================================================

          def get_localized(value, fallback=""):

              if isinstance(value, dict):

                  return str(
                      value.get("en_US")
                      or value.get("en_us")
                      or next(
                          iter(value.values()),
                          fallback
                      )
                      or fallback
                  ).strip()

              if value is None:
                  return fallback

              return str(value).strip()


          def get_main_image(data):

              services = data.get(
                  "services",
                  {}
              )

              if not isinstance(
                  services,
                  dict
              ):
                  return None


              casaos = data.get(
                  "x-casaos",
                  {}
              )

              if not isinstance(
                  casaos,
                  dict
              ):
                  casaos = {}


              main = casaos.get(
                  "main"
              )


              # --------------------------------------------------
              # Prefer x-casaos.main
              # --------------------------------------------------

              if (
                  main
                  and main in services
                  and isinstance(
                      services[main],
                      dict
                  )
              ):

                  image = services[main].get(
                      "image"
                  )

                  if isinstance(
                      image,
                      str
                  ):

                      return image.strip()


              # --------------------------------------------------
              # Fallback to first service with image
              # --------------------------------------------------

              for service in services.values():

                  if not isinstance(
                      service,
                      dict
                  ):
                      continue

                  image = service.get(
                      "image"
                  )

                  if isinstance(
                      image,
                      str
                  ):

                      return image.strip()


              return None


          def get_image_tag(image):

              if not image:
                  return None

              # Docker digest is not a tag.
              if "@" in image:
                  return None


              last = image.rsplit(
                  "/",
                  1
              )[-1]


              if ":" not in last:

                  return "latest"


              return last.rsplit(
                  ":",
                  1
              )[1]


          def get_version(casaos, data):

              # --------------------------------------------------
              # Prefer CasaOS V2 version
              # --------------------------------------------------

              version = casaos.get(
                  "version"
              )


              if (
                  version is not None
                  and str(version).strip()
              ):

                  return str(
                      version
                  ).strip()


              # --------------------------------------------------
              # Fallback to Docker image tag
              # --------------------------------------------------

              tag = get_image_tag(
                  get_main_image(data)
              )


              if tag:
                  return tag


              return "—"


          # ======================================================
          # SCAN APPS
          # ======================================================

          if os.path.isdir(ROOT):

              for app_name in sorted(
                  os.listdir(ROOT),
                  key=str.lower
              ):

                  app_dir = os.path.join(
                      ROOT,
                      app_name
                  )


                  if not os.path.isdir(
                      app_dir
                  ):
                      continue


                  compose_path = os.path.join(
                      app_dir,
                      "docker-compose.yml"
                  )


                  if not os.path.isfile(
                      compose_path
                  ):
                      continue


                  # ------------------------------------------------
                  # LOAD YAML
                  # ------------------------------------------------

                  try:

                      with open(
                          compose_path,
                          "r",
                          encoding="utf-8"
                      ) as f:

                          data = yaml.safe_load(
                              f
                          )

                  except Exception as e:

                      print(
                          f"WARNING: Could not read "
                          f"{compose_path}: {e}"
                      )

                      continue


                  if not isinstance(
                      data,
                      dict
                  ):
                      continue


                  casaos = data.get(
                      "x-casaos",
                      {}
                  )


                  if not isinstance(
                      casaos,
                      dict
                  ):
                      continue


                  # ------------------------------------------------
                  # NAME
                  # ------------------------------------------------

                  title = casaos.get(
                      "title"
                  )


                  name = get_localized(
                      title,
                      app_name
                  )


                  # ------------------------------------------------
                  # DESCRIPTION
                  # ------------------------------------------------

                  description = get_localized(
                      casaos.get(
                          "tagline"
                      ),
                      ""
                  )


                  if not description:

                      description = get_localized(
                          casaos.get(
                              "description"
                          ),
                          ""
                      )


                  # ------------------------------------------------
                  # ICON
                  # ------------------------------------------------

                  encoded_app = urllib.parse.quote(
                      app_name,
                      safe=""
                  )


                  icon_filename = None


                  for filename in [

                      "icon.png",
                      "icon.svg",
                      "icon.jpg",
                      "icon.jpeg",
                      "icon.webp",

                  ]:

                      candidate = os.path.join(
                          app_dir,
                          filename
                      )


                      if os.path.isfile(
                          candidate
                      ):

                          icon_filename = filename

                          break


                  if icon_filename is None:

                      icon_filename = "icon.png"


                  encoded_icon = urllib.parse.quote(
                      icon_filename,
                      safe=""
                  )


                  icon_url = (
                      "https://cdn.jsdelivr.net/gh/"
                      "yassinyl/casa7014@main/"
                      f"Apps/{encoded_app}/"
                      f"{encoded_icon}"
                  )


                  # ------------------------------------------------
                  # VERSION
                  # ------------------------------------------------

                  version = get_version(
                      casaos,
                      data
                  )


                  # ------------------------------------------------
                  # ID
                  # ------------------------------------------------

                  app_id = str(
                      casaos.get(
                          "id",
                          ""
                      )
                  ).strip()


                  apps.append({

                      "name": name,

                      "description": description,

                      "icon": icon_url,

                      "version": version,

                      "id": app_id,

                  })


          # ======================================================
          # SORT
          # ======================================================

          apps.sort(
              key=lambda x: x["name"].lower()
          )


          # ======================================================
          # BUILD TABLE
          # ======================================================

          lines = [

              START,

              "",

              "| Icon | Application | Version | Description |",

              "|:---:|---|:---:|---|"

          ]


          for app in apps:

              name = app[
                  "name"
              ].replace(
                  "|",
                  "\\|"
              )


              version = app[
                  "version"
              ].replace(
                  "|",
                  "\\|"
              )


              description = (
                  app["description"]
                  .replace(
                      "|",
                      "\\|"
                  )
                  .replace(
                      "\n",
                      " "
                  )
                  .strip()
              )


              lines.append(

                  f'| <img src="{app["icon"]}" '
                  f'width="48" height="48"> | '

                  f'**{name}** | '

                  f'`{version}` | '

                  f'{description} |'

              )


          lines.extend([

              "",

              END

          ])


          new_table = "\n".join(
              lines
          )


          # ======================================================
          # READ README
          # ======================================================

          if not os.path.isfile(
              README
          ):

              raise SystemExit(
                  "README.md not found."
              )


          with open(
              README,
              "r",
              encoding="utf-8"
          ) as f:

              content = f.read()


          # ======================================================
          # FIND TABLE
          # ======================================================

          pattern = re.compile(

              re.escape(
                  START
              )

              + r".*?"

              + re.escape(
                  END
              ),

              re.DOTALL

          )


          if not pattern.search(
              content
          ):

              raise SystemExit(

                  f"Could not find "
                  f"{START} / {END} "
                  f"markers in README.md"

              )


          # ======================================================
          # REPLACE TABLE
          # ======================================================

          updated = pattern.sub(

              new_table,

              content,

              count=1

          )


          # ======================================================
          # WRITE README
          # ======================================================

          with open(
              README,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  updated
              )


          # ======================================================
          # OUTPUT
          # ======================================================

          print()

          print(
              "=============================================="
          )

          print(
              f"README updated with "
              f"{len(apps)} application(s)."
          )

          print(
              "=============================================="
          )


          for app in apps:

              print(
                  f" - {app['name']} "
                  f"v{app['version']} "
                  f"({app['id'] or 'no id'})"
              )

          PY

      # ==========================================================
      # SHOW CHANGES
      # ==========================================================

      - name: Show README changes
        run: |

          echo "=============================================="
          echo "README DIFF"
          echo "=============================================="

          git diff -- README.md || true

      # ==========================================================
      # COMMIT AND PUSH
      # ==========================================================

      - name: Commit README update
        shell: bash
        run: |

          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add README.md


          if git diff --cached --quiet; then

              echo "README is already up to date."

              exit 0

          fi


          git commit \
            -m "docs: update application list [skip ci]"


          # IMPORTANT:
          # The repository has a tag named "main".
          # Therefore HEAD:main is ambiguous.
          # Always explicitly target the branch.

          git push \
            origin \
            HEAD:refs/heads/main


          echo

          echo "=============================================="

          echo "README UPDATED SUCCESSFULLY"

          echo "=============================================="
