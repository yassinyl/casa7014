name: snikket

services:
  snikket-proxy:
    image: snikket/snikket-web-proxy:stable
    container_name: snikket-proxy
    restart: unless-stopped
    environment:
      SNIKKET_DOMAIN: chat.example.com
      SNIKKET_ADMIN_EMAIL: admin@example.com
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /snikket

  snikket:
    image: snikket/snikket-server:stable.20260611
    container_name: snikket
    restart: unless-stopped
    environment:
      SNIKKET_DOMAIN: chat.example.com
      SNIKKET_ADMIN_EMAIL: admin@example.com
    ports:
      - target: 80
        published: "8080"
        protocol: tcp
      - target: 443
        published: "8443"
        protocol: tcp
      - target: 5000
        published: "5000"
        protocol: tcp
      - target: 5222
        published: "5222"
        protocol: tcp
      - target: 5269
        published: "5269"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /snikket

x-casaos:
  id: com.casa7014.snikket
  main: snikket
  architectures: [amd64, arm, arm64]
  port_map: "8080"
  index: /
  scheme: http
  title:
    en_US: Snikket
    ar_SA: سنيكيت
    de_DE: Snikket
    es_ES: Snikket
    fr_FR: Snikket
  author: yassinyl
  developer: Snikket Community Interest Company
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Snikket/icon.svg
  #screenshot_link:
   # - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Snikket/screenshot.png
  description:
    en_US: Private, easy-to-use XMPP messaging for your family, friends, or community.
    ar_SA: مراسلة XMPP خاصة وسهلة الاستخدام لعائلتك وأصدقائك أو مجتمعك.
    de_DE: Privates, einfach nutzbares XMPP-Messaging für Familie, Freunde oder Gemeinschaft.
    es_ES: Mensajería XMPP privada y fácil de usar para tu familia, amistades o comunidad.
    fr_FR: Messagerie XMPP privée et facile à utiliser pour votre famille, vos amis ou votre communauté.
  tagline:
    en_US: Your private messaging service
    ar_SA: خدمة المراسلة الخاصة بك
    de_DE: Ihr privater Nachrichtendienst
    es_ES: Tu servicio de mensajería privado
    fr_FR: Votre service de messagerie privé
  # The upstream image is intentionally tracked through its moving `stable` tag.
  # Keep the catalog value semantic so the V2 store generator publishes it.
  version: "stable.20260611"
  update_at: "2026-06-11"
  website: https://snikket.org/
  repo: https://github.com/snikket-im/snikket-server
  docs: https://snikket.org/service/help/admin/installation/docker/
  support: https://snikket.org/service/help/
  tips:
    before_install:
      en_US: >-
        Set SNIKKET_DOMAIN to the public domain for this server and
        SNIKKET_ADMIN_EMAIL to the administrator's email before first start.
        For a production server, change the published HTTP and HTTPS ports to
        80 and 443, and ensure 5000, 5222, and 5269 are reachable from the Internet.
    after_install:
      en_US: >-
        Open the web interface, complete the administrator setup, and install
        the Snikket app on your devices. Persistent server data is stored in
        /DATA/AppData/<AppID>/data. Do not change SNIKKET_DOMAIN after setup.
