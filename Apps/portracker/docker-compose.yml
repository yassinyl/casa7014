name: portracker
services:
  portracker:
    image: mostafawahied/portracker:1.3.13
    container_name: portracker
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - target: 4999
        published: "4999"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:4999/api/health
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
