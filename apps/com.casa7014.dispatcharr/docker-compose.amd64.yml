name: dispatcharr
services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.33.0@sha256:86e07402323b137e6da3ab206e7023d02531dc9bc9c4423c8e96c39042102d57
    container_name: dispatcharr
    restart: unless-stopped
    ports:
      - target: 9191
        published: "9191"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    environment:
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
x-casaos:
  id: com.casa7014.dispatcharr
  main: dispatcharr
  port_map: "9191"
  index: /
  scheme: http
  title:
    en_US: Dispatcharr
    ar_SA: Dispatcharr
    de_DE: Dispatcharr
    es_ES: Dispatcharr
    fr_FR: Dispatcharr
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@gh-pages/apps/com.casa7014.dispatcharr/assets/icon.png
  version: "0.33.0"
