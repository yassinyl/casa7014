services:
  motioneye:
    image: ghcr.io/motioneye-project/motioneye:0.43.1
    container_name: motioneye-yassinyl
    network_mode: bridge
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
    - 8765:8765
    - 9081:9081
    environment:
    - TZ=Africa/Tunis
    - PUID=1000
    - PGID=1000
    volumes:
    - /DATA/AppData/motioneye/etc_motioneye:/etc/motioneye
    - /DATA/AppData/motioneye/var_lib_motioneye:/var/lib/motioneye
x-casaos:
  architectures:
  - amd64
  - arm
  - arm64
  author: yassinyl
  developer: ccrisan
  category: Others
  description:
    en_US: 'MotionEye is an open-source video surveillance application that manages
      webcams easily with a graphical interface.

      '
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/icon.png
  screenshot_link:
  - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-1.png
  - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-2.png
  - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-3.png
  - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-4.png
  thumbnail: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/icon.png
  main: motioneye
  tagline:
    en_US: Video surveillance for your cameras
  title:
    en_US: MotionEye
  scheme: http
  hostname: ''
  port_map: '8765'
  index: /
  tips:
    before_install:
      en_US: "MotionEye requires a webcam or IP camera to be connected to function\
        \ properly. \nIf you use USB cameras, you can add their paths (like /dev/video0)\
        \ in the settings after installation.\nAfter installation, access the web\
        \ interface at: \nhttp://your_server_ip:8765\n"
  id: com.casa7014.motioneye-beta
  version: 0.43.1
name: motioneye-beta
