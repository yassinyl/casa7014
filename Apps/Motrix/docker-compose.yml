name: motrix

services:
  server:
    image: docker.io/motrixapp/motrix-server:2.0.0-beta.40
    environment:
      PUID: "1000"
      PGID: "1000"
      MOTRIX_DATA_DIR: /data
      MOTRIX_TEMP_DIR: /data/tmp
      MOTRIX_PLUGIN_DIR: /data/plugins
      MOTRIX_DEFAULT_SAVE_DIR: /downloads
      MOTRIX_ALLOWED_SAVE_DIRS: /downloads
      MOTRIX_ARIA2_RPC_LISTEN_ALL: "false"
      MOTRIX_MDXP_HOST: 0.0.0.0
      MOTRIX_MDXP_PORT: 16801
      MOTRIX_PUBLIC_URL: ""
      MOTRIX_REMOTE_EXTENSION_ENABLED: "false"
      MOTRIX_REMOTE_EXTENSION_PUBLIC_URL: ""
      MOTRIX_ALLOW_INSECURE_OPERATOR_HTTP: "true"
    ports:
      - "8080:8080"
      - "16801:16801"
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/Downloads/Motrix:/downloads

x-casaos:
  id: com.casa7014.motrix
  main: server
  architectures:
    - amd64
    - arm64
  port_map: "8080"
  index: /
  scheme: http
  title:
    en_US: Motrix
    ar_SA: Motrix
    de_DE: Motrix
    es_ES: Motrix
    fr_FR: Motrix
  author: yassinyl
  developer: agalwood
  category: Others
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Motrix/icon.png
  #screenshot_link:
   # - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Motrix/screenshot.png
  description:
    en_US: Motrix Server is a headless download manager for HTTP, FTP, BitTorrent and magnet links, with a browser-based interface.
    ar_SA: Motrix Server مدير تنزيلات بلا واجهة سطح مكتب لـ HTTP وFTP وBitTorrent وروابط magnet، مع واجهة عبر المتصفح.
    de_DE: Motrix Server ist ein Download-Manager ohne Desktopoberfläche für HTTP, FTP, BitTorrent und Magnet-Links mit browserbasierter Oberfläche.
    es_ES: Motrix Server es un gestor de descargas sin interfaz de escritorio para HTTP, FTP, BitTorrent y enlaces magnet, con interfaz web.
    fr_FR: Motrix Server est un gestionnaire de téléchargements sans interface de bureau pour HTTP, FTP, BitTorrent et liens magnet, avec une interface web.
  tagline:
    en_US: Powerful download manager for your NAS
    ar_SA: مدير تنزيلات قوي لجهاز NAS الخاص بك.
    de_DE: Leistungsstarker Download-Manager für Ihr NAS.
    es_ES: Potente gestor de descargas para tu NAS.
    fr_FR: Gestionnaire de téléchargements puissant pour votre NAS.
  version: "2.0.0-beta.40"
  update_at: "20-9-2026"
  repo: https://github.com/agalwood/Motrix
  docs: https://motrix.app/manual/docker/
  website: https://motrix.app/
  support: https://github.com/agalwood/Motrix/issues
  tips:
    before_install:
      en_US: |-
        Motrix Server uses UID/GID 1000:1000. Ensure that the host download directory is writable by this user.

        To prepare a download directory on your HDD, replace /YOUR/HDD/PATH/Motrix with the actual directory path and run:

        sudo mkdir -p "/YOUR/HDD/PATH/Motrix"
        sudo chown 1000:1000 "/YOUR/HDD/PATH/Motrix"
        sudo chmod 775 "/YOUR/HDD/PATH/Motrix"

        After starting Motrix for the first time, the Web UI will ask for an operator token. You can find it in /AppData/motrix/data, in a file named operator-token (without any file extension). Open this file as a plain text file to view and copy the token, then paste it into the Motrix Web UI. Do not add a file extension to operator-token.

        Direct HTTP operator access is enabled for trusted-LAN use. Do not expose port 8080 to the Internet. For remote pairing, configure MOTRIX_PUBLIC_URL with the reachable Web UI URL. MDXP uses port 16801.

        If you want to change the HDD or download directory after installation, stop Motrix first. Create the new download directory and apply the ownership and permission commands above. Then update the download volume mapping so the new host directory maps to /downloads. Save the configuration and start Motrix again. Keep the existing data directory unchanged to preserve your settings and operator token.

      fr_FR: |-
        Motrix Server utilise l'UID/GID 1000:1000. Assurez-vous que cet utilisateur dispose des droits d'écriture sur le dossier de téléchargement de l'hôte.

        Pour préparer un dossier de téléchargement sur votre disque dur, remplacez /YOUR/HDD/PATH/Motrix par le chemin réel du dossier, puis exécutez :

        sudo mkdir -p "/YOUR/HDD/PATH/Motrix"
        sudo chown 1000:1000 "/YOUR/HDD/PATH/Motrix"
        sudo chmod 775 "/YOUR/HDD/PATH/Motrix"

        Après le premier démarrage de Motrix, l'interface Web vous demandera un operator token. Vous le trouverez dans /AppData/motrix/data, dans un fichier nommé operator-token (sans extension). Ouvrez ce fichier comme un fichier texte brut pour afficher et copier le token, puis collez-le dans l'interface Web de Motrix. N'ajoutez aucune extension au fichier operator-token.

        L'accès HTTP direct à l'opérateur est activé pour un réseau local de confiance. N'exposez pas le port 8080 à Internet. Pour l'appairage à distance, configurez MOTRIX_PUBLIC_URL avec l'URL accessible de l'interface Web. MDXP utilise le port 16801.

        Pour changer de disque dur ou de dossier de téléchargement après l'installation, arrêtez d'abord Motrix. Créez le nouveau dossier de téléchargement et appliquez les commandes de propriétaire et de permissions ci-dessus. Modifiez ensuite le volume de téléchargement afin que le nouveau dossier hôte soit associé à /downloads. Enregistrez la configuration, puis redémarrez Motrix. Conservez le dossier de données existant pour préserver vos paramètres et votre operator token.
