name: pi-hole

services:
  pihole:
    image: pihole/pihole:2026.09.0
    container_name: pihole
    restart: unless-stopped
    ports:
      - target: 53
        published: "53"
        protocol: tcp
      - target: 53
        published: "53"
        protocol: udp
      - target: 80
        published: "80"
        protocol: tcp
    environment:
      TZ: $TZ
      FTLCONF_dns_listeningMode: all
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/etc-pihole
        target: /etc/pihole

x-casaos:
  id: com.casa7014.pi-hole
  main: pihole
  architectures: [amd64, arm64, arm]
  port_map: "80"
  index: /admin/
  scheme: http
  title:
    en_US: Pi-hole
    ar_SA: Pi-hole
    de_DE: Pi-hole
    es_ES: Pi-hole
    fr_FR: Pi-hole
  author: yassinyl
  developer: Pi-hole LLC
  category: Networking
  icon: https://raw.githubusercontent.com/pi-hole/graphics/master/Vortex/Vortex.svg
  description:
    en_US: Network-wide ad blocking and DNS management for your home network.
    ar_SA: حجب الإعلانات وإدارة DNS على مستوى شبكتك المنزلية.
    de_DE: Netzwerkweite Werbeblockierung und DNS-Verwaltung für Ihr Heimnetzwerk.
    es_ES: Bloqueo de anuncios y gestión de DNS para toda tu red doméstica.
    fr_FR: Blocage des publicités et gestion DNS pour l'ensemble de votre réseau domestique.
  tagline:
    en_US: Network-wide ad blocking
    ar_SA: حجب الإعلانات على مستوى الشبكة
    de_DE: Netzwerkweite Werbeblockierung
    es_ES: Bloqueo de anuncios en toda la red
    fr_FR: Blocage des publicités sur tout le réseau
  version: "2026.09.0"
  website: https://pi-hole.net/
  repo: https://github.com/pi-hole/pi-hole
  docs: https://docs.pi-hole.net/docker/
  support: https://discourse.pi-hole.net/
  tips:
    before_install:
      en_US: >-
        Pi-hole needs ports 53 (TCP/UDP) for DNS and 80 for its web interface.
        Make sure these ports are not already used. After installation, set your
        router or devices to use this server as their DNS resolver.
    after_install:
      en_US: >-
        Open the web interface, set an administrator password from the Pi-hole
        settings, then configure your router or devices to use this server for DNS.
