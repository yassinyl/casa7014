name: Migrate Casa7014 to V2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: casa7014-v2
  cancel-in-progress: false

jobs:

  migrate-v2:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      # ==========================================================
      # INSTALL YQ
      # ==========================================================

      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7

        run: |
          set -euo pipefail

          wget -qO /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -

          sudo install \
            -m 0755 \
            /tmp/yq \
            /usr/local/bin/yq

          yq --version

      # ==========================================================
      # TEST V2 SCRIPTS
      # ==========================================================

      - name: Test V2 scripts
        run: |
          set -euo pipefail

          bash -n .github/scripts/migrate-to-v2.sh
          bash -n .github/scripts/lint-casaos-v2.sh
          bash -n .github/scripts/detect-v2-migration.sh

          echo "All V2 scripts syntax OK."

      # ==========================================================
      # MIGRATE APPS
      # ==========================================================

      - name: Migrate Apps to V2
        run: |
          bash .github/scripts/migrate-to-v2.sh

      # ==========================================================
      # LINT
      # ==========================================================

      - name: Lint V2 invariants
        run: |
          bash .github/scripts/lint-casaos-v2.sh

      # ==========================================================
      # DETECT V2
      # ==========================================================

      - name: Detect V2 migration
        id: migrated
        run: |
          bash .github/scripts/detect-v2-migration.sh

      # ==========================================================
      # BUILD V2
      # ==========================================================

      - name: Build V2
        if: steps.migrated.outputs.migrated == 'true'
        id: build_v2

        uses: IceWhaleTech/build-appstore-action@787271faebb0ef2101eb0f85d5485ff7208140db

        with:
          source: .
          output: dist

          # IMPORTANT:
          # This must be the final public URL where dist/ is served.
          base-url: https://yassinyl.github.io/casa7014

      # ==========================================================
      # VERIFY V2 OUTPUT
      # ==========================================================

      - name: Verify V2 output
        if: steps.migrated.outputs.migrated == 'true'
        run: |
          set -euo pipefail

          echo "Checking V2 output..."

          test -d dist

          echo
          echo "Generated files:"
          find dist -maxdepth 5 -type f | sort

          echo
          echo "Checking required V2 files..."

          test -f dist/index.json
          test -f dist/store.json

          echo
          echo "V2 output verified successfully."

      # ==========================================================
      # UPLOAD V2 STORE AS ARTIFACT
      # ==========================================================

      - name: Upload V2 store artifact
        if: steps.migrated.outputs.migrated == 'true'
        uses: actions/upload-artifact@v6

        with:
          name: casa7014-v2-store
          path: dist
          if-no-files-found: error

      # ==========================================================
      # COMMIT MIGRATION
      # ==========================================================

      - name: Commit automatic V2 migration
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing automatic V2 migration commit..."

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Apps \
            store-config.json \
            supported-languages.json

          if git diff --cached --quiet; then

            echo "No migration changes."

          else

            git commit \
              -m "chore: migrate app store to CasaOS V2 [skip ci]"

            echo "Pushing migration to main..."

            git push \
              origin \
              HEAD:refs/heads/main

            echo "Migration committed successfully."

          fi

      # ==========================================================
      # CONFIGURE GITHUB PAGES
      # ==========================================================

      - name: Configure GitHub Pages
        if: steps.migrated.outputs.migrated == 'true'
        uses: actions/configure-pages@v5

      # ==========================================================
      # UPLOAD DIST TO GITHUB PAGES
      # ==========================================================

      - name: Upload GitHub Pages artifact
        if: steps.migrated.outputs.migrated == 'true'
        uses: actions/upload-pages-artifact@v4

        with:
          path: ./dist

      # ==========================================================
      # DEPLOY TO GITHUB PAGES
      # ==========================================================

      - name: Deploy to GitHub Pages
        if: steps.migrated.outputs.migrated == 'true'
        id: deployment

        uses: actions/deploy-pages@v4

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # FINAL STATUS
      # ==========================================================

      - name: Complete
        if: steps.migrated.outputs.migrated == 'true'
        run: |
          echo "=============================================="
          echo "Casa7014 V2 store deployed successfully."
          echo "=============================================="
          echo
          echo "Store URL:"
          echo "https://yassinyl.github.io/casa7014"
          echo
          echo "V2 files are served from GitHub Pages."
