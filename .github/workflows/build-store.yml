name: Build and Publish Store

on:
  push:
    branches: [main]
    paths:
      - "Apps/**"
      - "store-config.json"
      - "supported-languages.json"
      - "category-list.json"
      - "recommend-list.json"
      - ".github/workflows/build-store.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source catalog
        run: ruby .github/scripts/validate-store-catalog.rb .

      - name: Build CasaOS V2 Store
        uses: IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Casa7014 V2 build
          python-version: "3.11"
          install-system-deps: "true"

      - name: Preserve update dates in published metadata
        run: ruby .github/scripts/sync-update-at-metadata.rb . dist

      - name: Upload V2 build report
        uses: actions/upload-artifact@v5
        with:
          name: casa7014-v2-build-report
          path: out/build-v2-report.json
          if-no-files-found: ignore

      - name: Build CasaOS V1 ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/store
          cd Apps

          zip -r ../dist/store/main.zip . \
            -x "*/.git/*" \
            -x "*/.DS_Store"

          cp ../dist/store/main.zip ../dist/casa7014.zip

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Capture previous gh-pages revision
        id: gh_pages_before
        run: |
          set -euo pipefail

          previous="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"

          echo "sha=$previous" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: false

      - name: Collect changed gh-pages paths
        env:
          PREVIOUS_GH_PAGES_SHA: ${{ steps.gh_pages_before.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin gh-pages --depth=2

          current="$(git rev-parse origin/gh-pages)"

          mkdir -p out
          paths_file="out/jsdelivr-purge-paths.txt"
          : > "$paths_file"

          if [[ -n "$PREVIOUS_GH_PAGES_SHA" ]] &&
             git cat-file -e "$PREVIOUS_GH_PAGES_SHA^{commit}" 2>/dev/null; then

            git diff --name-only \
              "$PREVIOUS_GH_PAGES_SHA" \
              "$current" \
              -- > "$paths_file"
          else
            git diff-tree \
              --root \
              --no-commit-id \
              --name-only \
              -r "$current" > "$paths_file"
          fi

          # Always purge essential store files
          printf '%s\n' \
            store.json \
            index.json \
            store/main.zip \
            casa7014.zip >> "$paths_file"

          sort -u -o "$paths_file" "$paths_file"

          echo "Files selected for jsDelivr purge:"
          cat "$paths_file"

      - name: Purge jsDelivr cache
        run: |
          set -euo pipefail

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue

            url="https://purge.jsdelivr.net/gh/yassinyl/casa7014@gh-pages/$path"

            echo "----------------------------------------"
            echo "Purging: $path"

            response=$(curl \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              "$url") || {
                echo "::error::Purge request failed for $path"
                exit 1
              }

            echo "jsDelivr response:"
            echo "$response"

          done < out/jsdelivr-purge-paths.txt
