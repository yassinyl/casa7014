name: Fix CasaOS V2 Compose

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          set -e

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq

          yq --version

      - name: Remove legacy service-level x-casaos
        shell: bash
        run: |
          set -euo pipefail

          found=0
          fixed=0

          for compose in Apps/*/docker-compose.yml; do

            [ -f "$compose" ] || continue

            app="$(basename "$(dirname "$compose")")"

            count="$(
              yq eval '
                [
                  .services[]?
                  | select(has("x-casaos"))
                ]
                | length
              ' "$compose"
            )"

            if [ "$count" -eq 0 ]; then
              echo "OK: $app"
              continue
            fi

            found=1

            echo "FIX: $app"
            echo "Found $count service-level x-casaos block(s)"

            yq eval -i '
              .services |= with_entries(
                .value |= del(."x-casaos")
              )
            ' "$compose"

            remaining="$(
              yq eval '
                [
                  .services[]?
                  | select(has("x-casaos"))
                ]
                | length
              ' "$compose"
            )"

            if [ "$remaining" -ne 0 ]; then
              echo "ERROR: Failed to remove x-casaos from $compose"
              exit 1
            fi

            echo "FIXED: $app"

            fixed=$((fixed + 1))
          done

          echo
          echo "================================"
          echo "Apps fixed: $fixed"
          echo "================================"

          if [ "$found" -eq 0 ]; then
            echo "No legacy service-level x-casaos found."
          fi

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail

          for compose in Apps/*/docker-compose.yml; do

            [ -f "$compose" ] || continue

            echo "Validating: $compose"

            yq eval '.' "$compose" >/dev/null

            remaining="$(
              yq eval '
                [
                  .services[]?
                  | select(has("x-casaos"))
                ]
                | length
              ' "$compose"
            )"

            if [ "$remaining" -ne 0 ]; then
              echo "ERROR: service-level x-casaos still exists:"
              echo "$compose"
              exit 1
            fi

          done

          echo
          echo "All Compose files are valid."

      - name: Run CasaOS V2 validator
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ".github/scripts/lint-casaos-v2.sh" ]; then
            echo "ERROR: lint-casaos-v2.sh not found."
            exit 1
          fi

          chmod +x .github/scripts/lint-casaos-v2.sh

          .github/scripts/lint-casaos-v2.sh

      - name: Show changes
        run: |
          git status --short

          echo
          echo "Changed files:"
          git diff --name-only -- Apps/

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- Apps/; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Apps/*/docker-compose.yml

          git commit -m "fix: remove legacy service-level x-casaos"

          git push
