name: fing-agent
services:
  fing-agent:
    image: fing/fing-agent:1.1.1
    container_name: FingAgent
    network_mode: host
    cap_add: [NET_ADMIN]
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/fingdata
x-casaos:
  id: com.casa7014.fing-agent
  main: fing-agent
  port_map: "44444"
  index: /
  scheme: http
  title:
    en_US: Fing Agent
    ar_SA: Fing Agent
    de_DE: Fing Agent
    es_ES: Fing Agent
    fr_FR: Fing Agent
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@gh-pages/apps/com.casa7014.fing-agent/assets/icon.png
  version: "1.1.1"
