name: Validate CasaOS V2

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail
          wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Test and lint V2 metadata
        run: bash .github/scripts/test-v2-scripts.sh

      - name: Validate Docker Compose
        run: |
          set -euo pipefail
          for f in Apps/*/docker-compose.yml; do
            docker compose -f "$f" config -q
          done

      - name: Build V2 store for validation
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: /tmp/casa7014-dist
          base-url: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-validation-report.json
          report-title: Casa7014 V2 validation
          python-version: "3.11"
          install-system-deps: "true"

      - name: Verify published V2 catalog metadata
        run: ruby .github/scripts/verify-v2-build.rb . /tmp/casa7014-dist

      - name: Upload V2 validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa7014-v2-validation-report
          path: out/build-v2-validation-report.json
          if-no-files-found: ignore
