name: Generate Dependabot Config

on:
  push:
    paths:
      - 'Apps/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependabot.yml
        run: |
          mkdir -p .github
          echo "version: 2" > .github/dependabot.yml
          echo "updates:" >> .github/dependabot.yml
          
          for dir in Apps/*/; do
            if [ -f "$dir/docker-compose.yml" ]; then
              app_name=$(basename "$dir")
              echo "  - package-ecosystem: \"docker\"" >> .github/dependabot.yml
              echo "    directory: \"/Apps/$app_name\"" >> .github/dependabot.yml
              echo "    schedule:" >> .github/dependabot.yml
              echo "      interval: \"weekly\"" >> .github/dependabot.yml
              echo "    labels:" >> .github/dependabot.yml
              echo "      - \"docker-update\"" >> .github/dependabot.yml
              echo "" >> .github/dependabot.yml
            fi
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-update dependabot.yml"
          title: "🤖 Auto-update Dependabot config"
          body: "Automatically updated dependabot.yml configuration based on apps in Apps/"
          branch: "update-dependabot-config"
