name: Migrate Casa7014 to V2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casa7014-v2
  cancel-in-progress: false

jobs:
  migrate-v2:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-yaml \
            jq

          echo "Dependencies installed successfully."

      # ==========================================================
      # MIGRATE APPS TO V2
      # ==========================================================

      - name: Migrate Apps to V2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import yaml

          APPS_DIR = "Apps"

          ALLOWED_CATEGORIES = {
              "Media",
              "Productivity",
              "Home",
              "Networking",
              "AI",
              "Finance",
              "Social",
              "Developer",
              "Others",
          }

          CATEGORY_MAP = {
              "Casa7014": "Others",
              "Other": "Others",
              "Others": "Others",

              "Utility": "Productivity",
              "Utilities": "Productivity",
              "Tools": "Productivity",
              "Tool": "Productivity",

              "Network": "Networking",
              "Networking": "Networking",

              "Development": "Developer",
              "Developer": "Developer",

              "Media": "Media",
              "Productivity": "Productivity",
              "Home": "Home",
              "AI": "AI",
              "Finance": "Finance",
              "Social": "Social",
          }

          def normalize_locales(value):

              if isinstance(value, dict):

                  result = {}

                  for key, val in value.items():

                      if key.lower() == "en_us":
                          key = "en_US"

                      elif key.lower() == "zh_cn":
                          key = "zh_CN"

                      result[key] = normalize_locales(val)

                  return result

              if isinstance(value, list):

                  return [
                      normalize_locales(v)
                      for v in value
                  ]

              return value

          def make_id(app_name):

              slug = re.sub(
                  r"[^a-zA-Z0-9]+",
                  "-",
                  app_name
              ).strip("-").lower()

              return f"com.casa7014.{slug}"

          def get_existing_port(xc):

              value = xc.get("port_map")

              if value is None:
                  return None

              value = str(value).strip()

              if value.isdigit():
                  return value

              return None

          def get_compose_port(data):

              services = data.get(
                  "services",
                  {}
              )

              for service in services.values():

                  ports = service.get(
                      "ports",
                      []
                  )

                  if not isinstance(
                      ports,
                      list
                  ):
                      continue

                  for port in ports:

                      if isinstance(
                          port,
                          int
                      ):
                          return str(port)

                      if not isinstance(
                          port,
                          str
                      ):
                          continue

                      value = port.strip()

                      if "/udp" in value.lower():
                          continue

                      value = value.replace(
                          "/tcp",
                          ""
                      )

                      parts = value.split(":")

                      if len(parts) >= 2:

                          published = parts[-2]

                          if published.isdigit():
                              return published

                      elif len(parts) == 1:

                          if parts[0].isdigit():
                              return parts[0]

              return None

          def get_environment_port(data):

              services = data.get(
                  "services",
                  {}
              )

              preferred = [
                  "HTTP_PORT",
                  "WEB_PORT",
                  "SERVER_PORT",
                  "PORT",
                  "METRICS_PORT",
                  "CSS_METRICS_PORT",
              ]

              candidates = []

              for service in services.values():

                  env = service.get(
                      "environment",
                      []
                  )

                  if isinstance(
                      env,
                      dict
                  ):

                      items = env.items()

                  elif isinstance(
                      env,
                      list
                  ):

                      items = []

                      for item in env:

                          if not isinstance(
                              item,
                              str
                          ):
                              continue

                          if "=" not in item:
                              continue

                          key, value = item.split(
                              "=",
                              1
                          )

                          items.append(
                              (key, value)
                          )

                  else:

                      continue

                  for key, value in items:

                      if not isinstance(
                          value,
                          str
                      ):
                          continue

                      value = value.strip()

                      if not value.isdigit():
                          continue

                      if key.upper().endswith(
                          "_PORT"
                      ):

                          candidates.append(
                              (
                                  key.upper(),
                                  value
                              )
                          )

              for wanted in preferred:

                  for key, value in candidates:

                      if key == wanted:
                          return value

              if candidates:
                  return candidates[0][1]

              return None

          errors = []

          for app_name in sorted(
              os.listdir(APPS_DIR)
          ):

              app_dir = os.path.join(
                  APPS_DIR,
                  app_name
              )

              if not os.path.isdir(
                  app_dir
              ):
                  continue

              compose_path = os.path.join(
                  app_dir,
                  "docker-compose.yml"
              )

              if not os.path.isfile(
                  compose_path
              ):
                  continue

              print()
              print("=" * 70)
              print(f"Migrating: {app_name}")
              print("=" * 70)

              try:

                  with open(
                      compose_path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = yaml.safe_load(f)

              except Exception as e:

                  errors.append(
                      f"{app_name}: YAML error: {e}"
                  )

                  continue

              if not isinstance(
                  data,
                  dict
              ):

                  errors.append(
                      f"{app_name}: invalid YAML"
                  )

                  continue

              services = data.get(
                  "services",
                  {}
              )

              if not isinstance(
                  services,
                  dict
              ) or not services:

                  errors.append(
                      f"{app_name}: no services"
                  )

                  continue

              # ==================================================
              # TOP LEVEL NAME
              # ==================================================

              if not data.get("name"):

                  data["name"] = re.sub(
                      r"[^a-zA-Z0-9_-]+",
                      "-",
                      app_name
                  ).strip("-").lower()

              # ==================================================
              # X-CASAOS
              # ==================================================

              xc = data.get(
                  "x-casaos"
              )

              if not isinstance(
                  xc,
                  dict
              ):

                  xc = {}

              # ==================================================
              # ID
              # ==================================================

              current_id = xc.get(
                  "id"
              )

              if (
                  not isinstance(
                      current_id,
                      str
                  )
                  or not current_id.strip()
              ):

                  xc["id"] = make_id(
                      app_name
                  )

              # IMPORTANT:
              # x-casaos.id is directly under x-casaos

              assert "id" in xc

              # ==================================================
              # MAIN
              # ==================================================

              if not xc.get("main"):

                  if len(services) == 1:

                      xc["main"] = next(
                          iter(services)
                      )

              if not xc.get("main"):

                  errors.append(
                      f"{app_name}: "
                      "cannot determine main service"
                  )

                  continue

              # ==================================================
              # INDEX
              # ==================================================

              if not xc.get("index"):

                  xc["index"] = "/"

              # ==================================================
              # PORT
              # ==================================================

              port = get_existing_port(
                  xc
              )

              if port is None:

                  port = get_compose_port(
                      data
                  )

              if port is None:

                  port = get_environment_port(
                      data
                  )

              # CastSponsorSkip
              if (
                  port is None
                  and app_name.lower()
                  == "castsponsorskip"
              ):

                  port = "9790"

              if port is None:

                  errors.append(
                      f"{app_name}: "
                      "cannot determine port_map"
                  )

                  continue

              xc["port_map"] = str(
                  port
              )

              # ==================================================
              # SCHEME
              # ==================================================

              if not xc.get("scheme"):

                  xc["scheme"] = "http"

              # ==================================================
              # ICON
              # ==================================================

              if not xc.get("icon"):

                  icon_files = [
                      "icon.svg",
                      "icon.png",
                      "icon.jpg",
                      "icon.jpeg",
                  ]

                  found_icon = None

                  for icon in icon_files:

                      icon_path = os.path.join(
                          app_dir,
                          icon
                      )

                      if os.path.isfile(
                          icon_path
                      ):

                          found_icon = icon
                          break

                  if found_icon:

                      xc["icon"] = (
                          "https://cdn.jsdelivr.net/gh/"
                          "yassinyl/casa7014@main/"
                          "Apps/"
                          f"{app_name}/"
                          f"{found_icon}"
                      )

                  else:

                      errors.append(
                          f"{app_name}: "
                          "missing icon"
                      )

                      continue

              # ==================================================
              # LOCALES
              # ==================================================

              xc = normalize_locales(
                  xc
              )

              # ==================================================
              # TITLE
              # ==================================================

              if not xc.get("title"):

                  xc["title"] = {
                      "en_US": app_name
                  }

              # ==================================================
              # TAGLINE
              # ==================================================

              if not xc.get("tagline"):

                  xc["tagline"] = {
                      "en_US": app_name
                  }

              # ==================================================
              # DESCRIPTION
              # ==================================================

              if not xc.get("description"):

                  xc["description"] = {
                      "en_US": app_name
                  }

              # ==================================================
              # CATEGORY
              # ==================================================

              category = xc.get(
                  "category"
              )

              if category not in ALLOWED_CATEGORIES:

                  xc["category"] = CATEGORY_MAP.get(
                      category,
                      "Others"
                  )

              # ==================================================
              # ARCHITECTURES
              # ==================================================

              if not xc.get(
                  "architectures"
              ):

                  xc["architectures"] = [
                      "amd64",
                      "arm64"
                  ]

              # ==================================================
              # VERSION
              # ==================================================

              if not xc.get("version"):

                  xc["version"] = "1.0.0"

              # ==================================================
              # SAVE
              # ==================================================

              data["x-casaos"] = xc

              with open(
                  compose_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  yaml.safe_dump(
                      data,
                      f,
                      sort_keys=False,
                      allow_unicode=True
                  )

              print(
                  f"ID:       {xc['id']}"
              )

              print(
                  f"MAIN:     {xc['main']}"
              )

              print(
                  f"PORT:     {xc['port_map']}"
              )

              print(
                  f"CATEGORY: {xc['category']}"
              )

              print(
                  f"VERSION:  {xc['version']}"
              )

              print("Migration: OK")

          if errors:

              print()
              print("=" * 70)
              print("MIGRATION ERRORS")
              print("=" * 70)

              for error in errors:
                  print(
                      f"ERROR: {error}"
                  )

              raise SystemExit(1)

          print()
          print("=" * 70)
          print("ALL APPS MIGRATED SUCCESSFULLY")
          print("=" * 70)
          PY

      # ==========================================================
      # SUPPORTED LANGUAGES
      # ==========================================================

      - name: Create supported-languages.json
        run: |
          cat > supported-languages.json <<'EOF'
          [
            "en_US"
          ]
          EOF

      # ==========================================================
      # NORMALIZE STORE CONFIG
      # ==========================================================

      - name: Normalize store-config.json
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os

          path = "store-config.json"

          if os.path.isfile(path):

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as f:

                  config = json.load(f)

          else:

              config = {}

          config["version"] = 2

          if not isinstance(
              config.get("store_id"),
              str
          ) or not config["store_id"].strip():

              config["store_id"] = "casa7014-yl"

          # ------------------------------------------------------
          # NAME
          # ------------------------------------------------------

          name = config.get(
              "name"
          )

          if isinstance(
              name,
              str
          ):

              config["name"] = {
                  "en_US": name
              }

          elif not isinstance(
              name,
              dict
          ):

              config["name"] = {
                  "en_US": "Casa7014 AppStore"
              }

          elif not config["name"].get(
              "en_US"
          ):

              first = next(
                  iter(
                      config["name"].values()
                  ),
                  "Casa7014 AppStore"
              )

              config["name"]["en_US"] = str(
                  first
              )

          # ------------------------------------------------------
          # DESCRIPTION
          # ------------------------------------------------------

          description = config.get(
              "description"
          )

          if isinstance(
              description,
              str
          ):

              config["description"] = {
                  "en_US": description
              }

          elif description is None:

              config["description"] = {
                  "en_US": "Casa7014 App Store"
              }

          elif isinstance(
              description,
              dict
          ):

              if not description.get(
                  "en_US"
              ):

                  first = next(
                      iter(
                          description.values()
                      ),
                      "Casa7014 App Store"
                  )

                  description["en_US"] = str(
                      first
                  )

          # ------------------------------------------------------
          # MAINTAINER
          # ------------------------------------------------------

          if not config.get(
              "maintainer"
          ):

              config["maintainer"] = "yassinyl"

          # ------------------------------------------------------
          # URL
          # ------------------------------------------------------

          if not config.get(
              "url"
          ):

              config["url"] = (
                  "https://github.com/"
                  "yassinyl/casa7014"
              )

          with open(
              path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  config,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")

          print(
              json.dumps(
                  config,
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY

      # ==========================================================
      # VALIDATE STORE CONFIG
      # ==========================================================

      - name: Validate store-config.json
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re

          with open(
              "store-config.json",
              encoding="utf-8"
          ) as f:

              config = json.load(f)

          if config.get("version") != 2:
              raise SystemExit(
                  "store-config.json: "
                  "version must be 2"
              )

          if not isinstance(
              config.get("store_id"),
              str
          ):

              raise SystemExit(
                  "store-config.json: "
                  "store_id invalid"
              )

          if not re.fullmatch(
              r"[A-Za-z0-9._-]+",
              config["store_id"]
          ):

              raise SystemExit(
                  "store-config.json: "
                  "invalid store_id"
              )

          if not isinstance(
              config.get("name"),
              dict
          ):

              raise SystemExit(
                  "store-config.json: "
                  "name must be object"
              )

          if not isinstance(
              config["name"].get("en_US"),
              str
          ):

              raise SystemExit(
                  "store-config.json: "
                  "name.en_US missing"
              )

          print(
              "store-config.json: OK"
          )
          PY

      # ==========================================================
      # VALIDATE APPS
      # ==========================================================

      - name: Validate V2 source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import yaml

          REQUIRED = [
              "id",
              "main",
              "index",
              "port_map",
              "icon",
              "title",
              "category",
              "version",
          ]

          CATEGORIES = {
              "Media",
              "Productivity",
              "Home",
              "Networking",
              "AI",
              "Finance",
              "Social",
              "Developer",
              "Others",
          }

          errors = []

          for app_name in sorted(
              os.listdir("Apps")
          ):

              compose = os.path.join(
                  "Apps",
                  app_name,
                  "docker-compose.yml"
              )

              if not os.path.isfile(
                  compose
              ):
                  continue

              print(
                  f"Checking {compose}"
              )

              with open(
                  compose,
                  encoding="utf-8"
              ) as f:

                  data = yaml.safe_load(f)

              if not isinstance(
                  data,
                  dict
              ):

                  errors.append(
                      f"{app_name}: invalid YAML"
                  )

                  continue

              xc = data.get(
                  "x-casaos"
              )

              if not isinstance(
                  xc,
                  dict
              ):

                  errors.append(
                      f"{app_name}: "
                      "missing x-casaos"
                  )

                  continue

              # ID MUST BE DIRECTLY UNDER X-CASAOS
              app_id = xc.get(
                  "id"
              )

              if not isinstance(
                  app_id,
                  str
              ):

                  errors.append(
                      f"{app_name}: "
                      "x-casaos.id missing"
                  )

              elif not re.fullmatch(
                  r"[A-Za-z0-9._-]+",
                  app_id
              ):

                  errors.append(
                      f"{app_name}: "
                      f"invalid id: {app_id}"
                  )

              # Required fields
              for field in REQUIRED:

                  if not xc.get(field):

                      errors.append(
                          f"{app_name}: "
                          f"x-casaos.{field} missing"
                      )

              # Category
              if xc.get(
                  "category"
              ) not in CATEGORIES:

                  errors.append(
                      f"{app_name}: "
                      "invalid category"
                  )

              # port_map must be string
              if not isinstance(
                  xc.get("port_map"),
                  str
              ):

                  errors.append(
                      f"{app_name}: "
                      "port_map must be string"
                  )

              # main service must exist
              services = data.get(
                  "services",
                  {}
              )

              main = xc.get(
                  "main"
              )

              if (
                  isinstance(
                      services,
                      dict
                  )
                  and main not in services
              ):

                  errors.append(
                      f"{app_name}: "
                      f"main service '{main}' "
                      "does not exist"
                  )

              if not errors:

                  print(
                      f"  ID: {app_id}"
                  )

                  print(
                      f"  PORT: {xc.get('port_map')}"
                  )

                  print(
                      "  OK"
                  )

          if errors:

              print()
              print("=" * 70)
              print("V2 VALIDATION ERRORS")
              print("=" * 70)

              for error in errors:

                  print(
                      f"ERROR: {error}"
                  )

              raise SystemExit(1)

          print()
          print(
              "ALL APPS PASSED V2 VALIDATION"
          )
          PY

      # ==========================================================
      # SHOW RESULT
      # ==========================================================

      - name: Show migrated structure
        run: |
          echo "======================================"
          echo "STORE CONFIG"
          echo "======================================"

          cat store-config.json

          echo
          echo "======================================"
          echo "SAMPLE APP"
          echo "======================================"

          FIRST_APP=$(
            find Apps \
              -mindepth 2 \
              -maxdepth 2 \
              -name docker-compose.yml \
              | sort \
              | head -n 1
          )

          if [ -n "$FIRST_APP" ]; then
            cat "$FIRST_APP"
          fi

      # ==========================================================
      # COMMIT
      # ==========================================================

      - name: Commit V2 migration
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Apps \
            store-config.json \
            supported-languages.json

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "chore: migrate app store to CasaOS V2 [skip ci]"

            git push \
              origin \
              HEAD:refs/heads/main

          fi

      # ==========================================================
      # BUILD V2
      # ==========================================================

      - name: Build CasaOS V2
        id: build_v2
        uses: IceWhaleTech/build-appstore-action@main
        with:
          source: .
          output: dist
          base-url: https://yassinletaief.tn/casa7014
          report-json: out/build-v2-report.json
          report-title: Casa7014 V2 Build Report

      # ==========================================================
      # VERIFY BUILD
      # ==========================================================

      - name: Verify V2 output
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "V2 BUILD OUTPUT"
          echo "======================================"

          find dist \
            -maxdepth 5 \
            -type f \
            | sort

          echo
          echo "Checking store.json..."

          test -f dist/store.json

          echo "Checking index.json..."

          test -f dist/index.json

          echo
          echo "V2 BUILD OUTPUT OK"

      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload V2 Store
        uses: actions/upload-artifact@v6
        with:
          name: casa7014-v2-store
          path: dist
          if-no-files-found: error

      # ==========================================================
      # BUILD REPORT
      # ==========================================================

      - name: Upload V2 build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: casa7014-v2-report
          path: out/build-v2-report.json
          if-no-files-found: warn
