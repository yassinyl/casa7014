name: motioneye-beta
services:
  motioneye:
    image: ghcr.io/motioneye-project/motioneye:0.43.1
    container_name: motioneye-yassinyl
    network_mode: bridge
    restart: unless-stopped
    ports:
      - target: 8765
        published: "8765"
        protocol: tcp
      - target: 9081
        published: "9081"
        protocol: tcp
    environment:
      TZ: $TZ
      PUID: "1000"
      PGID: "1000"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/etc_motioneye
        target: /etc/motioneye
      - type: bind
        source: /DATA/AppData/$AppID/var_lib_motioneye
        target: /var/lib/motioneye
x-casaos:
  id: com.casa7014.motioneye-beta
  main: motioneye
  architectures: [amd64, arm, arm64]
  port_map: "8765"
  index: /
  scheme: http
  title:
    en_US: MotionEye
    ar_SA: MotionEye
    de_DE: MotionEye
    es_ES: MotionEye
    fr_FR: MotionEye
  author: yassinyl
  developer: motioneye-project
  category: Others
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/icon.png
  #  thumbnail: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/motioneye%20beta/screenshot-4.png
  description:
    en_US: Open-source video surveillance application for managing webcams and IP cameras.
    ar_SA: تطبيق مفتوح المصدر لمراقبة الفيديو وإدارة كاميرات الويب وكاميرات IP.
    de_DE: Open-Source-Videoüberwachung zur Verwaltung von Webcams und IP-Kameras.
    es_ES: Aplicación de videovigilancia de código abierto para gestionar cámaras web y cámaras IP.
    fr_FR: Application de vidéosurveillance open source pour gérer les webcams et les caméras IP.
  tagline:
    en_US: Video surveillance for your cameras
    ar_SA: مراقبة فيديو لكاميراتك.
    de_DE: Videoüberwachung für Ihre Kameras.
    es_ES: Videovigilancia para tus cámaras.
    fr_FR: Vidéosurveillance pour vos caméras.
  version: "0.43.1"
  repo: https://github.com/motioneye-project/motioneye
