name: Migrate Casa7014 to V2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: casa7014-v2
  cancel-in-progress: false

jobs:

  migrate-v2:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      # ==========================================================
      # INSTALL YQ
      # ==========================================================

      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7

        run: |
          set -euo pipefail

          wget -qO /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -

          sudo install \
            -m 0755 \
            /tmp/yq \
            /usr/local/bin/yq

          yq --version

      # ==========================================================
      # TEST V2 SCRIPTS
      # ==========================================================

      - name: Test V2 scripts
        run: |
          set -euo pipefail

          bash -n .github/scripts/migrate-to-v2.sh
          bash -n .github/scripts/lint-casaos-v2.sh
          bash -n .github/scripts/detect-v2-migration.sh

          echo "All V2 scripts syntax OK."

      # ==========================================================
      # MIGRATE APPS TO V2
      # ==========================================================

      - name: Migrate Apps to V2
        run: |
          set -euo pipefail

          bash .github/scripts/migrate-to-v2.sh

      # ==========================================================
      # DETECT REAL DOCKER IMAGE ARCHITECTURES
      # ==========================================================

      - name: Normalize V2 architectures from Docker manifests
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Detecting real Docker image architectures"
          echo "=============================================="

          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import yaml

          APPS_DIR = "Apps"

          PLATFORM_MAP = {
              "linux/amd64": "amd64",
              "linux/arm64": "arm64",
              "linux/arm/v7": "arm",
              "linux/arm/v6": "arm",
              "linux/386": "386",
              "linux/ppc64le": "ppc64le",
              "linux/s390x": "s390x",
          }

          def normalize_image(image):
              image = image.strip()

              if image.startswith("docker.io/"):
                  image = image[len("docker.io/"):]

              if "/" not in image.split("@")[0]:
                  image = "library/" + image

              return image

          def split_image(image):
              image = normalize_image(image)

              if "@" in image:
                  repository, reference = image.split("@", 1)
                  return repository, reference

              last = image.rsplit("/", 1)[-1]

              if ":" in last:
                  repository, tag = image.rsplit(":", 1)
                  return repository, tag

              return image, "latest"

          def registry_manifest(image):
              repository, reference = split_image(image)

              print(
                  f"Inspecting Docker image: "
                  f"{repository}:{reference}"
              )

              token_query = urllib.parse.urlencode({
                  "service": "registry.docker.io",
                  "scope": f"repository:{repository}:pull"
              })

              token_url = (
                  "https://auth.docker.io/token?"
                  + token_query
              )

              token_request = urllib.request.Request(
                  token_url
              )

              with urllib.request.urlopen(
                  token_request,
                  timeout=30
              ) as response:

                  token_data = json.load(response)

              token = token_data["token"]

              manifest_url = (
                  f"https://registry-1.docker.io/v2/"
                  f"{repository}/manifests/{reference}"
              )

              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": ",".join([
                      "application/vnd.oci.image.index.v1+json",
                      "application/vnd.docker.distribution.manifest.list.v2+json",
                      "application/vnd.oci.image.manifest.v1+json",
                      "application/vnd.docker.distribution.manifest.v2+json",
                  ])
              }

              request = urllib.request.Request(
                  manifest_url,
                  headers=headers
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.load(response)

          def get_platforms(manifest):
              if not isinstance(manifest, dict):
                  return []

              manifests = manifest.get("manifests")

              if not isinstance(manifests, list):
                  return []

              platforms = []

              for item in manifests:

                  platform = item.get(
                      "platform",
                      {}
                  )

                  os_name = platform.get("os")
                  architecture = platform.get("architecture")
                  variant = platform.get("variant")

                  if os_name != "linux":
                      continue

                  if not architecture:
                      continue

                  value = f"linux/{architecture}"

                  if variant:
                      value += f"/{variant}"

                  platforms.append(value)

              return platforms

          def get_main_image(data):
              services = data.get(
                  "services",
                  {}
              )

              if not isinstance(services, dict):
                  return None, None

              xc = data.get(
                  "x-casaos",
                  {}
              )

              if not isinstance(xc, dict):
                  xc = {}

              main = xc.get("main")

              if main and main in services:

                  service = services[main]

                  if isinstance(service, dict):

                      image = service.get("image")

                      if isinstance(image, str):
                          return main, image

              for service_name, service in services.items():

                  if not isinstance(service, dict):
                      continue

                  image = service.get("image")

                  if isinstance(image, str):
                      return service_name, image

              return None, None

          changed = 0

          for app_name in sorted(
              os.listdir(APPS_DIR)
          ):

              app_dir = os.path.join(
                  APPS_DIR,
                  app_name
              )

              if not os.path.isdir(app_dir):
                  continue

              compose_path = os.path.join(
                  app_dir,
                  "docker-compose.yml"
              )

              if not os.path.isfile(compose_path):
                  continue

              print()
              print("=" * 70)
              print(f"App: {app_name}")
              print("=" * 70)

              try:

                  with open(
                      compose_path,
                      encoding="utf-8"
                  ) as f:

                      data = yaml.safe_load(f)

              except Exception as exc:

                  print(
                      f"WARNING: cannot read YAML: {exc}"
                  )

                  continue

              if not isinstance(data, dict):
                  continue

              xc = data.get(
                  "x-casaos",
                  {}
              )

              if not isinstance(xc, dict):
                  continue

              service_name, image = get_main_image(data)

              if not image:

                  print(
                      "WARNING: no Docker image found."
                  )

                  continue

              print(
                  f"Main service: {service_name}"
              )

              print(
                  f"Image: {image}"
              )

              try:

                  manifest = registry_manifest(image)

              except Exception as exc:

                  print(
                      f"WARNING: unable to inspect "
                      f"Docker manifest: {exc}"
                  )

                  print(
                      "Keeping existing architectures."
                  )

                  continue

              platforms = get_platforms(manifest)

              if not platforms:

                  print(
                      "WARNING: image does not expose a "
                      "multi-platform manifest."
                  )

                  print(
                      "Keeping existing architectures."
                  )

                  continue

              print()
              print("Docker platforms:")

              for platform in platforms:
                  print(f"  - {platform}")

              detected = []

              for platform in platforms:

                  architecture = PLATFORM_MAP.get(
                      platform
                  )

                  if (
                      architecture
                      and architecture not in detected
                  ):

                      detected.append(
                          architecture
                      )

              if not detected:

                  print(
                      "WARNING: no supported CasaOS "
                      "architectures detected."
                  )

                  continue

              current = xc.get(
                  "architectures",
                  []
              )

              if not isinstance(
                  current,
                  list
              ):

                  current = []

              current = [
                  str(value)
                  for value in current
                  if value
              ]

              print()
              print(
                  "Current architectures:"
              )

              print(
                  "  " + ", ".join(current)
              )

              print()
              print(
                  "Detected architectures:"
              )

              print(
                  "  " + ", ".join(detected)
              )

              if current != detected:

                  xc["architectures"] = detected

                  data["x-casaos"] = xc

                  with open(
                      compose_path,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      yaml.safe_dump(
                          data,
                          f,
                          sort_keys=False,
                          allow_unicode=True
                      )

                  changed += 1

                  print()
                  print(
                      "Architecture metadata updated."
                  )

              else:

                  print()
                  print(
                      "Architecture metadata already correct."
                  )

          print()
          print("=" * 70)
          print(
              "Architecture normalization complete."
          )
          print(
              f"Apps changed: {changed}"
          )
          print("=" * 70)

          PY

      # ==========================================================
      # LINT V2
      # ==========================================================

      - name: Lint V2 invariants
        run: |
          set -euo pipefail

          bash .github/scripts/lint-casaos-v2.sh

      # ==========================================================
      # DETECT V2 MIGRATION
      # ==========================================================

      - name: Detect V2 migration
        id: migrated
        run: |
          set -euo pipefail

          bash .github/scripts/detect-v2-migration.sh

      # ==========================================================
      # BUILD V2
      # ==========================================================

      - name: Build V2
        if: steps.migrated.outputs.migrated == 'true'
        id: build_v2
        continue-on-error: true

        uses: IceWhaleTech/build-appstore-action@787271faebb0ef2101eb0f85d5485ff7208140db

        with:
          source: .
          output: dist
          base-url: https://yassinyl.github.io/casa7014

      # ==========================================================
      # SHOW BUILD RESULT
      # ==========================================================

      - name: Show V2 build result
        if: always()
        run: |
          echo "=============================================="
          echo "V2 BUILD RESULT"
          echo "=============================================="

          echo
          echo "Build outcome:"
          echo "${{ steps.build_v2.outcome }}"

          echo
          echo "Current directory:"
          pwd

          echo
          echo "=============================================="
          echo "DIST CONTENT"
          echo "=============================================="

          if [ -d dist ]; then
            find dist -type f | sort
          else
            echo "dist directory does not exist."
          fi

      # ==========================================================
      # VERIFY V2 OUTPUT
      # ==========================================================

      - name: Verify V2 output
        if: steps.build_v2.outcome == 'success'
        run: |
          set -euo pipefail

          echo "Checking V2 output..."

          test -d dist

          echo
          echo "Generated V2 files:"
          find dist -type f | sort

          echo
          echo "V2 output verified successfully."

      # ==========================================================
      # CREATE CASAOS V1 ZIP
      # ==========================================================

      - name: Create CasaOS V1 ZIP
        if: steps.build_v2.outcome == 'success'
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Creating CasaOS V1 ZIP"
          echo "=============================================="

          rm -f casa7014.zip

          zip -r casa7014.zip \
            Apps \
            category-list.json \
            recommend-list.json \
            -x "*.png"

          echo
          echo "CasaOS V1 ZIP created:"
          ls -lh casa7014.zip

          echo
          echo "Adding ZIP to V2 dist..."

          cp casa7014.zip dist/casa7014.zip

          echo
          echo "ZIP inside dist:"
          ls -lh dist/casa7014.zip

      # ==========================================================
      # UPLOAD V2 STORE ARTIFACT
      # ==========================================================

      - name: Upload V2 store artifact
        if: always() && steps.migrated.outputs.migrated == 'true'
        uses: actions/upload-artifact@v6

        with:
          name: casa7014-v2-store
          path: dist
          if-no-files-found: ignore

      # ==========================================================
      # FAIL IF BUILD FAILED
      # ==========================================================

      - name: Fail if V2 build failed
        if: steps.build_v2.outcome != 'success'
        run: |
          echo "=============================================="
          echo "Casa7014 V2 BUILD FAILED"
          echo "=============================================="
          echo
          echo "Check the Build V2 output above."
          echo
          exit 1

      # ==========================================================
      # COMMIT AUTOMATIC V2 MIGRATION
      # ==========================================================

      - name: Commit automatic V2 migration
        if: steps.build_v2.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing automatic V2 migration commit..."

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Apps \
            store-config.json \
            supported-languages.json

          if git diff --cached --quiet; then

            echo "No migration changes."

          else

            git commit \
              -m "chore: migrate app store to CasaOS V2 [skip ci]"

            echo "Pushing migration to main..."

            git push \
              origin \
              HEAD:refs/heads/main

            echo "Migration committed successfully."

          fi

      # ==========================================================
      # CONFIGURE GITHUB PAGES
      # ==========================================================

      - name: Configure GitHub Pages
        if: steps.build_v2.outcome == 'success'
        uses: actions/configure-pages@v5

      # ==========================================================
      # UPLOAD DIST TO GITHUB PAGES
      # ==========================================================

      - name: Upload GitHub Pages artifact
        if: steps.build_v2.outcome == 'success'
        uses: actions/upload-pages-artifact@v4

        with:
          path: ./dist

      # ==========================================================
      # DEPLOY TO GITHUB PAGES
      # ==========================================================

      - name: Deploy to GitHub Pages
        if: steps.build_v2.outcome == 'success'
        id: deployment

        uses: actions/deploy-pages@v4

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # COMPLETE
      # ==========================================================

      - name: Complete
        if: steps.build_v2.outcome == 'success'
        run: |
          echo
          echo "=============================================="
          echo "CASA7014 STORE DEPLOYED SUCCESSFULLY"
          echo "=============================================="
          echo
          echo "ZimaOS V2:"
          echo "https://yassinyl.github.io/casa7014"
          echo
          echo "ZimaOS store.json:"
          echo "https://yassinyl.github.io/casa7014/store.json"
          echo
          echo "CasaOS V1 ZIP:"
          echo "https://yassinyl.github.io/casa7014/casa7014.zip"
