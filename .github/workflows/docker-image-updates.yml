name: Docker Image Updates

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docker-image-updates
  cancel-in-progress: false

jobs:

  update-images:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            PyYAML \
            packaging

      # ======================================================
      # CHECK DOCKER IMAGES
      # ======================================================

      - name: Check Docker images
        id: updater
        run: |
          set -euo pipefail

          python .github/scripts/update_docker_images.py

      # ======================================================
      # SHOW CHANGES
      # ======================================================

      - name: Show changes
        run: |
          echo "=============================================="
          echo "DOCKER IMAGE CHANGES"
          echo "=============================================="

          git status --short

          echo
          echo "=============================================="
          echo "DIFF"
          echo "=============================================="

          git diff -- Apps

      # ======================================================
      # CREATE PULL REQUEST
      # ======================================================

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        id: create-pr

        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          base: main

          branch: docker-image-updates

          delete-branch: true

          commit-message: "chore(docker): update docker images"

          title: "chore(docker): update Docker images"

          body-path: .github/PR_BODY.md

          labels: |
            docker
            updates

          add-paths: |
            Apps/**/docker-compose.yml

      # ======================================================
      # RESULT
      # ======================================================

      - name: Show Pull Request result
        if: always()
        run: |
          echo "=============================================="
          echo "DOCKER IMAGE UPDATE RESULT"
          echo "=============================================="

          echo "PR number:"
          echo "${{ steps.create-pr.outputs.pull-request-number }}"

          echo
          echo "PR URL:"
          echo "${{ steps.create-pr.outputs.pull-request-url }}"

          echo
          echo "Branch:"
          echo "${{ steps.create-pr.outputs.pull-request-branch }}"

          echo
          echo "=============================================="
