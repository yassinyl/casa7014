name: motrix

services:
  server:
    image: docker.io/motrixapp/motrix-server:2.0.0-beta.39
    init: true
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 2m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      MOTRIX_DATA_DIR: /data
      MOTRIX_TEMP_DIR: /data/tmp
      MOTRIX_PLUGIN_DIR: /data/plugins
      MOTRIX_DEFAULT_SAVE_DIR: /downloads
      MOTRIX_ALLOWED_SAVE_DIRS: /downloads
      MOTRIX_ARIA2_RPC_LISTEN_ALL: "false"
      MOTRIX_MDXP_HOST: 0.0.0.0
      MOTRIX_MDXP_PORT: 16801
      MOTRIX_PUBLIC_URL: ""
      MOTRIX_REMOTE_EXTENSION_ENABLED: "false"
      MOTRIX_REMOTE_EXTENSION_PUBLIC_URL: ""
      MOTRIX_ALLOW_INSECURE_OPERATOR_HTTP: "true"
    ports:
      - "8080:8080"
      - "16801:16801"
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/Downloads/Motrix:/downloads

x-casaos:
  id: com.casa7014.motrix
  main: server
  architectures:
    - amd64
    - arm64
  port_map: "8080"
  index: /
  scheme: http
  title:
    en_US: Motrix
  author: yassinyl
  developer: agalwood
  category: Others
  icon: https://cdn.jsdelivr.net/gh/yassinyl/casa7014@refs/heads/main/Apps/Motrix/icon.png
  description:
    en_US: Motrix Server is a headless download manager for HTTP, FTP, BitTorrent and magnet links, with a browser-based interface.
  tagline:
    en_US: Powerful download manager for your NAS
  version: "2.0.0-beta.39"
  repo: https://github.com/agalwood/Motrix
  docs: https://motrix.app/manual/docker/
  website: https://motrix.app/
  support: https://github.com/agalwood/Motrix/issues
  tips:
    before_install:
      en_US: "Motrix Server runs as UID/GID 1000. On first start, open /DATA/AppData/<AppID>/data and copy operator-token into the Web UI. Direct HTTP operator access is enabled for trusted-LAN use; do not expose port 8080 to the Internet. For remote pairing, configure MOTRIX_PUBLIC_URL with the reachable Web UI URL. MDXP uses port 16801. Ensure the data and downloads folders are writable by UID/GID 1000."
